<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit Funds - BD Marketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { background: #0b1222; font-family: 'Inter', sans-serif; color: white; margin: 0; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; }
        .input-gradient { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.3s ease; }
        .input-gradient:focus { border-color: #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.3); outline: none; }
        .btn-premium { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); transition: all 0.3s ease; }
        .btn-premium:active { transform: scale(0.95); }
        .copy-toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #10b981; color: white; padding: 10px 20px; border-radius: 50px; font-size: 12px; font-weight: bold; display: none; z-index: 1000; }
    </style>
</head>
<body>

    <div id="copy-msg" class="copy-toast uppercase tracking-widest">Number Copied!</div>

    <div class="max-w-md mx-auto p-6">
        <div class="flex items-center justify-between mb-8">
            <button onclick="window.location.href='buyer_dashboard.html'" class="w-10 h-10 glass-panel flex justify-center items-center">
                <i class="fas fa-chevron-left text-sm"></i>
            </button>
            <h2 class="text-xs font-black uppercase tracking-[3px]">Deposit Funds</h2>
            <div class="w-10"></div>
        </div>

        <!-- পেমেন্ট নম্বর (কপি বাটন সহ) -->
        <div class="grid grid-cols-1 gap-3 mb-8">
            <div class="glass-panel p-4 flex justify-between items-center border-l-4 border-pink-500">
                <div>
                    <p class="text-[9px] font-bold text-gray-500 uppercase">bKash (Personal)</p>
                    <p id="bkash-num" class="text-sm font-black tracking-widest">01725780575</p>
                </div>
                <button onclick="copyNumber('01725780575')" class="bg-pink-500/10 text-pink-500 px-3 py-2 rounded-lg text-[10px] font-black uppercase active:scale-90 transition-all">
                    <i class="fas fa-copy mr-1"></i> Copy
                </button>
            </div>

            <div class="glass-panel p-4 flex justify-between items-center border-l-4 border-orange-500">
                <div>
                    <p class="text-[9px] font-bold text-gray-500 uppercase">Nagad (Personal)</p>
                    <p id="nagad-num" class="text-sm font-black tracking-widest">01763584939</p>
                </div>
                <button onclick="copyNumber('01763584939')" class="bg-orange-500/10 text-orange-500 px-3 py-2 rounded-lg text-[10px] font-black uppercase active:scale-90 transition-all">
                    <i class="fas fa-copy mr-1"></i> Copy
                </button>
            </div>
        </div>

        <div class="glass-panel p-6 shadow-2xl">
            <div class="space-y-4">
                <div>
                    <label class="text-[9px] font-black uppercase text-blue-400 mb-2 block ml-1">Deposit Amount (BDT)</label>
                    <input type="number" id="amount" class="input-gradient w-full p-4 rounded-xl text-sm font-bold" placeholder="Minimum: 20 BDT">
                </div>

                <div>
                    <label class="text-[9px] font-black uppercase text-blue-400 mb-2 block ml-1">Your Sender Number</label>
                    <input type="text" id="sender-num" class="input-gradient w-full p-4 rounded-xl text-sm font-bold" placeholder="017XXXXXXXX">
                </div>

                <div>
                    <label class="text-[9px] font-black uppercase text-blue-400 mb-2 block ml-1">Transaction ID</label>
                    <input type="text" id="trxid" class="input-gradient w-full p-4 rounded-xl text-sm font-bold" placeholder="Enter Transaction ID">
                </div>

                <div class="pt-4">
                    <button id="submit-btn" class="btn-premium w-full py-4 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-lg">
                        Submit Deposit
                    </button>
                </div>
            </div>
        </div>

        <p class="text-center text-[8px] text-gray-600 mt-6 uppercase font-bold tracking-tighter">
            * Minimum deposit is 20 BDT. Verification takes 5-30 minutes.
        </p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDRwrekZBZ31ACszDk2EJM_IqxRRwaGfCg",
            authDomain: "bd-marketing-55a81.firebaseapp.com",
            databaseURL: "https://bd-marketing-55a81-default-rtdb.firebaseio.com",
            projectId: "bd-marketing-55a81",
            storageBucket: "bd-marketing-55a81.firebasestorage.app",
            messagingSenderId: "678696512628",
            appId: "1:678696512628:web:edfc22a62f55dad41df521"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        // নম্বর কপি করার ফাংশন
        window.copyNumber = (num) => {
            navigator.clipboard.writeText(num);
            const toast = document.getElementById('copy-msg');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 2000);
        };

        document.getElementById('submit-btn').addEventListener('click', () => {
            const user = auth.currentUser;
            if (!user) return alert("Login Required!");

            const amount = parseFloat(document.getElementById('amount').value);
            const trx = document.getElementById('trxid').value;
            const sender = document.getElementById('sender-num').value;

            if (isNaN(amount) || amount < 20) return alert("Minimum deposit is 20 BDT!");
            if (!trx || !sender) return alert("Fill all details!");

            const newReq = push(ref(db, 'deposits/'));
            set(newReq, {
                uid: user.uid,
                amount: amount,
                sender: sender,
                trxid: trx,
                status: "Pending",
                timestamp: Date.now()
            }).then(() => {
                alert("Request Sent!");
                window.location.href = "buyer_dashboard.html";
            });
        });
    </script>
</body>
</html>
