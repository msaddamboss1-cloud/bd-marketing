<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
    <div class="container">
        <h3>টাকা জমা দিন</h3>
        <div class="card" style="background:#fff4e6; border-left: 5px solid #f39c12;">
            <p>বিকাশ (Personal): <b>01725780575</b></p>
            <p>নগদ (Personal): <b>01763584939</b></p>
            <small>* সেন্ড মানি করে নিচের ফর্মটি পূরণ করুন।</small>
        </div>
        <input type="number" id="dAmount" placeholder="টাকার পরিমাণ">
        <input type="text" id="dTrx" placeholder="Transaction ID (TrxID)">
        <select id="dMethod"><option>Bkash</option><option>Nagad</option></select>
        <button class="btn-primary" onclick="sendDep()">ডিপোজিট রিকোয়েস্ট পাঠান</button>
        <button onclick="history.back()" style="background:#bdc3c7; color:#333;">ফিরে যান</button>
    </div>
    <script src="config.js"></script>
    <script>
        function sendDep(){
            const a=document.getElementById('dAmount').value, t=document.getElementById('dTrx').value, m=document.getElementById('dMethod').value;
            if(!a || !t) { alert("সব তথ্য দিন"); return; }
            db.collection("deposits").add({
                uid:auth.currentUser.uid, 
                email:auth.currentUser.email, 
                amount:parseFloat(a), 
                trx:t, 
                method:m, 
                status:"pending", 
                date:new Date().toLocaleString()
            }).then(()=>{
                alert("রিকোয়েস্ট পাঠানো হয়েছে! অ্যাডমিন চেক করে ব্যালেন্স এড করবে।");
                location.href="buyer-dashboard.html";
            });
        }
    </script>
</body>
</html>
