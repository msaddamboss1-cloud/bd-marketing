
<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit - BD Marketing</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
<div class="app-container">
    <div class="glass-card">
        <h2 style="color:var(--primary)">Add Money</h2>
        <div style="background:rgba(0,0,0,0.5); padding:15px; border-radius:15px; margin-top:15px; font-size:14px;">
            <p>🚀 <b>Nagad (Personal):</b> 01763584939</p>
            <p>🚀 <b>Bkash (Personal):</b> 01725780575</p>
            <p style="color:var(--primary); margin-top:10px;">* টাকা পাঠিয়ে ট্রানজ্যাকশন আইডি নিচে দিন।</p>
        </div>
        
        <input id="amount" type="number" placeholder="Amount (৳)">
        <input id="trxId" placeholder="Transaction ID">
        <select id="method">
            <option value="Nagad">Nagad</option>
            <option value="Bkash">Bkash</option>
        </select>
        <button onclick="submitDep()">SUBMIT DEPOSIT</button>
        <p id="msg" class="error-msg" style="color:var(--primary)"></p>
    </div>
</div>

<script src="config.js"></script>
<script src="global-logic.js"></script>
<script>
async function submitDep() {
    const user = auth.currentUser;
    if(!user) return redirect("index.html");

    const amt = Number(amount.value);
    const tid = trxId.value.trim();

    if(amt < 10) return document.getElementById("msg").innerText = "Minimum 10 TK";
    if(tid.length < 5) return document.getElementById("msg").innerText = "Invalid TRX ID";

    await db.collection("transactions").add({
        type: "deposit",
        uid: user.uid,
        email: user.email,
        amount: amt,
        trxId: tid,
        method: method.value,
        status: "pending",
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    document.getElementById("msg").innerText = "Request Sent! Wait for Approval.";
    setTimeout(() => redirect("dashboard.html"), 2000);
}
</script>
</body>
</html>
