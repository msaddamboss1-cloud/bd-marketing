<!DOCTYPE html><html><head><link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="config.js"></script></head>
<body class="auth-body">
<div class="glass-card">
  <h3>Deposit Funds</h3>
  <div style="text-align:left; background:rgba(0,0,0,0.5); padding:10px; border-radius:10px; margin-bottom:10px;">
    <p>🚀 <b>Nagad (Personal):</b> <span id="n" style="color:#e74c3c;">01763584939</span> <button onclick="cp('n')" style="padding:2px 8px; font-size:10px; width:auto;">Copy</button></p>
    <p>🚀 <b>Bkash (Personal):</b> <span id="b" style="color:#e91e63;">01725780575</span> <button onclick="cp('b')" style="padding:2px 8px; font-size:10px; width:auto;">Copy</button></p>
  </div>
  <input id="amt" type="number" placeholder="Amount (৳)">
  <input id="trx" placeholder="Transaction ID">
  <select id="mth"><option>Nagad</option><option>Bkash</option></select>
  <button onclick="dep()">Submit Request</button>
  <a href="buyer-dashboard.html" class="muted">Cancel</a>
</div>
<script>
function cp(i){navigator.clipboard.writeText(document.getElementById(i).innerText); alert("Number Copied!");}
function dep(){
  auth.onAuthStateChanged(u=>{
    db.collection("deposits").add({
      userId:u.uid, amount:Number(document.getElementById("amt").value),
      method:document.getElementById("mth").value, trxId:document.getElementById("trx").value,
      status:"pending", date: new Date()
    }).then(()=>{alert("Deposit Pending!"); location.href="buyer-dashboard.html";});
  });
}
</script></body></html>
