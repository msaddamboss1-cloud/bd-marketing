<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile | BD-MARKETING</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #090c10; color: #f8fafc; margin: 0; }
        .glass-card { background: rgba(22, 27, 34, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 40px; }
        .glow-border { position: relative; }
        .glow-border::after { content: ''; position: absolute; inset: -1px; background: linear-gradient(45deg, #3b82f6, transparent, #3b82f6); border-radius: 40px; z-index: -1; opacity: 0.3; }
        .gender-btn { transition: all 0.3s ease; border: 1px solid #30363d; background: #161b22; }
        .active-male { border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
        .active-female { border-color: #ec4899; background: rgba(236, 72, 153, 0.1); color: #ec4899; box-shadow: 0 0 15px rgba(236, 72, 153, 0.2); }
        .stat-icon { background: linear-gradient(135deg, #1e293b, #0f172a); }
    </style>
</head>
<body class="pb-10">

    <header class="p-6 pt-10 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <button onclick="window.history.back()" class="h-11 w-11 glass-card flex items-center justify-center text-blue-500 shadow-xl active:scale-90 transition-all">
                <i class="fas fa-chevron-left"></i>
            </button>
            <h1 class="text-xl font-black italic uppercase tracking-tighter text-white">USER PANEL</h1>
        </div>
        <button id="logoutBtn" class="h-11 w-11 glass-card flex items-center justify-center text-red-500 shadow-xl active:scale-90 transition-all">
            <i class="fas fa-sign-out-alt"></i>
        </button>
    </header>

    <main class="px-6 space-y-6">

        <div class="glass-card glow-border p-8 text-center shadow-2xl">
            <div class="relative w-32 h-32 mx-auto mb-5">
                <img id="profilePic" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="w-full h-full rounded-full object-cover border-4 border-blue-600 p-1.5 shadow-[0_0_20px_rgba(59,130,246,0.5)]">
            </div>
            
            <h2 id="regName" class="text-2xl font-black italic uppercase text-white tracking-wide">লোড হচ্ছে...</h2>
            <p id="regEmail" class="text-[11px] text-slate-500 font-bold mb-6 tracking-[3px] uppercase">Wait a moment...</p>
            
            <div class="flex justify-center gap-4 mb-8">
                <button onclick="updateGender('Male')" id="mBtn" class="gender-btn flex items-center gap-2 px-6 py-2.5 rounded-full text-[10px] font-black uppercase">
                    <i class="fas fa-mars"></i> MALE
                </button>
                <button onclick="updateGender('Female')" id="fBtn" class="gender-btn flex items-center gap-2 px-6 py-2.5 rounded-full text-[10px] font-black uppercase">
                    <i class="fas fa-venus"></i> FEMALE
                </button>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="stat-icon p-5 rounded-[30px] border border-white/5">
                    <p class="text-[9px] text-slate-500 uppercase font-black mb-1">ব্যালেন্স</p>
                    <p id="liveBalance" class="text-xl font-black text-green-500 tracking-tighter">৳ 0.00</p>
                </div>
                <div class="stat-icon p-5 rounded-[30px] border border-white/5">
                    <p class="text-[9px] text-slate-500 uppercase font-black mb-1">মোট আয়</p>
                    <p id="totalIncome" class="text-xl font-black text-blue-500 tracking-tighter">৳ 0.00</p>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-between px-6 py-4 glass-card rounded-3xl">
            <div class="flex items-center gap-3">
                <i class="fas fa-calendar-alt text-blue-500"></i>
                <span class="text-[10px] font-bold text-slate-400 uppercase">মেম্বারশিপ শুরু:</span>
            </div>
            <span id="joinDate" class="text-[10px] font-black text-white italic">-- / -- / --</span>
        </div>

        <div class="grid grid-cols-3 gap-3">
            <div class="glass-card p-5 text-center border-b-2 border-orange-500/30">
                <i class="fas fa-clock text-orange-500 text-xs mb-2"></i>
                <p id="pTasks" class="text-xl font-black text-white">0</p>
                <p class="text-[8px] text-slate-500 font-bold uppercase">পেন্ডিং</p>
            </div>
            <div class="glass-card p-5 text-center border-b-2 border-green-500/30">
                <i class="fas fa-check-circle text-green-500 text-xs mb-2"></i>
                <p id="sTasks" class="text-xl font-black text-white">0</p>
                <p class="text-[8px] text-slate-500 font-bold uppercase">সফল</p>
            </div>
            <div class="glass-card p-5 text-center border-b-2 border-red-500/30">
                <i class="fas fa-times-circle text-red-500 text-xs mb-2"></i>
                <p id="rTasks" class="text-xl font-black text-white">0</p>
                <p class="text-[8px] text-slate-500 font-bold uppercase">বাতিল</p>
            </div>
        </div>

        <div id="statusStrip" class="w-full py-4 rounded-[25px] text-center font-black uppercase text-[10px] tracking-[4px] glass-card transition-all duration-700">
            STATUS: <span id="stLabel">VERIFYING...</span>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDRwrekZBZ31ACszDk2EJM_IqxRRwaGfCg",
            authDomain: "bd-marketing-55a81.firebaseapp.com",
            projectId: "bd-marketing-55a81",
            appId: "1:678696512628:web:edfc22a62f55dad41df521"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const mAvatar = "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
        const fAvatar = "https://cdn-icons-png.flaticon.com/512/6997/6997662.png";

        onAuthStateChanged(auth, (user) => {
            if (user) {
                // রিয়েল-টাইম ডাটা ফেচ লজিক
                onSnapshot(doc(db, "users", user.uid), (snap) => {
                    if (snap.exists()) {
                        const d = snap.data();
                        
                        // রেজিস্ট্রেশন নাম ও ইমেইল সেট
                        document.getElementById('regName').innerText = d.name || "Unknown User";
                        document.getElementById('regEmail').innerText = user.email;
                        
                        // জেন্ডার ও ফটো লজিক
                        const gen = d.gender || 'Male';
                        document.getElementById('profilePic').src = (gen === 'Male') ? mAvatar : fAvatar;
                        document.getElementById('mBtn').className = "gender-btn flex items-center gap-2 px-6 py-2.5 rounded-full text-[10px] font-black uppercase " + (gen === 'Male' ? 'active-male' : '');
                        document.getElementById('fBtn').className = "gender-btn flex items-center gap-2 px-6 py-2.5 rounded-full text-[10px] font-black uppercase " + (gen === 'Female' ? 'active-female' : '');

                        // লাইভ ব্যালেন্স ও টাস্ক হিসাব
                        document.getElementById('liveBalance').innerText = `৳ ${(d.balance || 0).toFixed(2)}`;
                        document.getElementById('totalIncome').innerText = `৳ ${(d.totalEarn || 0).toFixed(2)}`;
                        document.getElementById('pTasks').innerText = d.pendingTasks || 0;
                        document.getElementById('sTasks').innerText = d.completedTasks || 0;
                        document.getElementById('rTasks').innerText = d.rejectedTasks || 0;
                        
                        // জয়েনিং ডেট লজিক
                        document.getElementById('joinDate').innerText = d.joinDate || "নিউ মেম্বার";

                        // একাউন্ট স্ট্যাটাস চেক
                        const label = document.getElementById('stLabel');
                        const strip = document.getElementById('statusStrip');
                        if(d.status === 'blocked') {
                            label.innerText = "BLOCKED ❌"; label.className = "text-red-500";
                            strip.style.borderColor = "rgba(239, 68, 68, 0.4)";
                        } else {
                            label.innerText = "ACTIVE ✅"; label.className = "text-green-500";
                            strip.style.borderColor = "rgba(34, 197, 94, 0.4)";
                        }
                    }
                });
            } else { window.location.replace("login.html"); }
        });

        // জেন্ডার আপডেট ফাংশন
        window.updateGender = async (val) => {
            const u = auth.currentUser;
            if (u) {
                try {
                    await updateDoc(doc(db, "users", u.uid), { gender: val });
                } catch (err) { console.error("Update failed"); }
            }
        };

        document.getElementById('logoutBtn').onclick = () => signOut(auth).then(() => window.location.replace("login.html"));
    </script>
</body>
</html>
