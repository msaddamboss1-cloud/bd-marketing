<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - BD Marketing</title><link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="glass-card">
        <div style="font-size: 50px; color: var(--accent);"><i class="fa fa-user-circle"></i></div>
        <h3 id="pName">...</h3>
        <p id="pEmail" style="opacity: 0.7; font-size: 0.9em;">...</p>
        <p id="pRole" style="color: var(--accent); font-weight: bold; text-transform: capitalize;"></p>
        
        <hr style="opacity: 0.1; margin: 20px 0;">
        
        <button onclick="location.href='support.html'" class="btn-primary" style="background: #1e293b; color: white;">
            <i class="fa fa-headset"></i> হেল্প সেন্টার
        </button>
        
        <button id="logoutBtn" class="btn-primary" style="background: #ef4444; color: white;">
            <i class="fa fa-sign-out-alt"></i> লগআউট
        </button>
    </div>

    <script type="module">
        import { auth, db } from './config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snap = await getDoc(doc(db, "users", user.uid));
                const data = snap.data();
                document.getElementById('pName').innerText = data.name;
                document.getElementById('pEmail').innerText = user.email;
                document.getElementById('pRole').innerText = "Role: " + data.role;
            } else { window.location.href = 'index.html'; }
        });

        document.getElementById('logoutBtn').onclick = () => {
            signOut(auth).then(() => { window.location.href = 'index.html'; });
        };
    </script>
</body>
</html>
