<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background: #0f172a; color: white;">
    <div style="display: flex; justify-content: space-between; padding: 15px; background: #1e293b;">
        <div id="menuBtn" style="font-size: 24px; cursor: pointer;"><i class="fas fa-bars"></i></div>
        <div style="font-weight: bold; color: #fbbf24;">BD Marketing (Seller)</div>
        <div style="width: 24px;"></div>
    </div>

    <div id="sideMenu" style="position: fixed; top: 0; left: -250px; width: 250px; height: 100%; background: #1e293b; z-index: 1000; transition: 0.3s; padding: 20px;">
        <h3 style="border-bottom: 1px solid #334155; padding-bottom: 10px;">মেনু</h3>
        <a href="profile.html" style="display:block; padding: 10px 0; color: white; text-decoration: none;">প্রোফাইল</a>
        <a href="withdraw.html" style="display:block; padding: 10px 0; color: white; text-decoration: none;">টাকা উত্তোলন</a>
        <button onclick="logout()" style="margin-top: 20px; background: #ef4444; border: none; color: white; padding: 8px 15px; border-radius: 5px;">লগআউট</button>
    </div>

    <div style="padding: 20px;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
            <div class="glass-card" style="padding: 15px; background: #1e293b; border-radius: 10px; border-left: 4px solid #fbbf24;">
                <small>মূল ব্যালেন্স</small>
                <h3 style="margin: 5px 0;">৳ <span id="mainBal">০.০০</span></h3>
            </div>
            <div class="glass-card" style="padding: 15px; background: #1e293b; border-radius: 10px; border-left: 4px solid #38bdf8;">
                <small>পেন্ডিং কাজ</small>
                <h3 style="margin: 5px 0;"><span id="pendingJobs">০</span> টি</h3>
            </div>
        </div>

        <h4>কাজের লিস্ট</h4>
        <div id="jobList">
            <p style="color: #64748b;">কাজ লোড হচ্ছে...</p>
        </div>
    </div>

    <script type="module">
        // Firebase Auth and SideMenu Logic (Same as above)
        const menuBtn = document.getElementById('menuBtn');
        const sideMenu = document.getElementById('sideMenu');
        let isOpen = false;
        
        menuBtn.onclick = () => {
            isOpen = !isOpen;
            sideMenu.style.left = isOpen ? "0px" : "-250px";
        };
    </script>
</body>
</html>
