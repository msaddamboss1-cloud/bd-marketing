<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Master Panel | BD-MARKETING</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700;800&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #010205; color: #e2e8f0; margin: 0; }
        
        /* প্রিমিয়াম এমারাল্ড ও গ্লাস থিম */
        .glass-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(212, 175, 55, 0.15); border-radius: 28px; backdrop-filter: blur(10px); }
        .action-btn { background: linear-gradient(135deg, #d4af37 0%, #9a7d28 100%); color: #000; box-shadow: 0 8px 20px rgba(212, 175, 55, 0.2); }
        .secondary-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        .nav-bar { background: rgba(1, 2, 5, 0.95); border-top: 1px solid rgba(212, 175, 55, 0.1); backdrop-filter: blur(20px); }
        .nav-link { color: #525252; font-size: 11px; font-weight: 800; text-transform: uppercase; transition: 0.3s; }
        .nav-link.active { color: #d4af37; }

        .gold-glow { color: #d4af37; text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
        .online-blink { width: 8px; height: 8px; background: #d4af37; border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(212, 175, 55, 0); } 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); } }
    </style>
</head>
<body class="pb-32">

    <header class="p-6 flex justify-between items-center sticky top-0 z-50 bg-[#010205]/80 backdrop-blur-xl">
        <div>
            <h1 class="text-2xl font-black italic tracking-tighter uppercase leading-none">SELLER <span class="gold-glow">PRO</span></h1>
            <div class="flex items-center gap-2 mt-1.5">
                <div class="online-blink"></div>
                <p class="text-[9px] text-gray-500 font-bold uppercase tracking-[3px]">Supreme Owner: Saddam</p>
            </div>
        </div>
        <a href="profile.html" class="relative group">
            <div class="w-12 h-12 rounded-2xl border border-white/10 bg-white/5 flex items-center justify-center transition-all group-active:scale-90">
                <i class="fas fa-user-gear text-xl text-gold-glow"></i>
            </div>
            <div class="absolute -top-1 -right-1 w-3 h-3 bg-green-500 border-2 border-[#010205] rounded-full"></div>
        </a>
    </header>

    <main class="p-5 max-w-md mx-auto space-y-6">

        <section class="glass-card p-8 text-center relative overflow-hidden">
            <div class="absolute top-0 right-0 p-4 opacity-5 pointer-events-none">
                <i class="fas fa-crown text-7xl text-gold-glow"></i>
            </div>
            <p class="text-[10px] uppercase font-bold text-gray-500 tracking-[4px] mb-3">টোটাল বিজ্ঞাপন বাজেট</p>
            <h2 class="text-5xl font-black text-white italic tracking-tight">৳ <span id="seller-balance">0.00</span></h2>
            
            <div class="grid grid-cols-2 gap-4 mt-8">
                <button class="secondary-btn py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest active:scale-95 transition-all">
                    <i class="fas fa-list-ul mr-2 text-gold-glow"></i> হিস্ট্রি
                </button>
                <button class="action-btn py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest active:scale-95 transition-all">
                    <i class="fas fa-plus-circle mr-2"></i> টাকা জমা দিন
                </button>
            </div>
        </section>

        <div class="grid grid-cols-2 gap-4">
            <div onclick="window.location.href='post-job.html'" class="glass-card p-6 flex flex-col items-center justify-center gap-3 active:scale-95 transition-all cursor-pointer">
                <div class="w-12 h-12 rounded-full bg-gold-glow/10 flex items-center justify-center text-gold-glow">
                    <i class="fas fa-paper-plane text-xl"></i>
                </div>
                <span class="text-[10px] font-black uppercase tracking-wider text-white">নতুন কাজ দিন</span>
            </div>
            <div onclick="window.location.href='check-proofs.html'" class="glass-card p-6 flex flex-col items-center justify-center gap-3 active:scale-95 transition-all cursor-pointer">
                <div class="w-12 h-12 rounded-full bg-blue-500/10 flex items-center justify-center text-blue-400">
                    <i class="fas fa-file-signature text-xl"></i>
                </div>
                <span class="text-[10px] font-black uppercase tracking-wider text-white">কাজ যাচাই করুন</span>
            </div>
        </div>

        <div class="flex justify-between items-center px-1">
            <h3 class="text-[11px] font-black uppercase tracking-[3px] text-gray-500">চলমান ক্যাম্পেইন</h3>
            <div class="h-[1px] flex-grow mx-4 bg-white/5"></div>
            <span class="text-gold-glow text-[10px] font-bold italic">LIVE: 0</span>
        </div>

        <section id="campaign-list" class="glass-card p-12 text-center border-dashed border-white/5">
            <div class="opacity-20">
                <i class="fas fa-rocket text-4xl mb-4"></i>
                <p class="text-[10px] font-bold uppercase tracking-widest">বর্তমানে কোনো বিজ্ঞাপন অ্যাক্টিভ নেই</p>
            </div>
        </section>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 nav-bar py-5 z-50">
        <div class="max-w-md mx-auto flex justify-around items-center px-6">
            <a href="seller-home.html" class="nav-link active flex flex-col items-center gap-1.5">
                <i class="fas fa-house text-xl"></i>
                <span>হোম</span>
            </a>
            <a href="campaigns.html" class="nav-link flex flex-col items-center gap-1.5">
                <i class="fas fa-chart-pie text-xl"></i>
                <span>ম্যানেজ</span>
            </a>
            <a href="support.html" class="nav-link flex flex-col items-center gap-1.5">
                <i class="fas fa-headset text-xl"></i>
                <span>হেল্প</span>
            </a>
        </div>
    </nav>
