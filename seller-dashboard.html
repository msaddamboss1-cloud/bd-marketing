<!DOCTYPE html>
<html lang="bn">
<head><link rel="stylesheet" href="style.css"><title>Seller Panel</title></head>
<body>
    <div class="container">
        <div class="card">
            <h3>নতুন কাজ আপলোড (বিক্রেতা)</h3>
            <p>প্রতিটি কাজে ১৫% অ্যাডমিন কমিশন প্রযোজ্য।</p>
            <input type="text" id="jobTitle" placeholder="কাজের নাম (উদা: FB Followers)">
            <input type="number" id="jobPrice" placeholder="কাজের মূল্য (৳)">
            <input type="text" id="jobLink" placeholder="লিঙ্ক দিন">
            <button class="btn seller-btn" onclick="postJob()">কাজ পাবলিশ করুন</button>
        </div>
    </div>
    <script src="config.js"></script>
    <script>
        async function postJob() {
            const title = document.getElementById('jobTitle').value;
            const price = parseFloat(document.getElementById('jobPrice').value);
            const commission = price * 0.15; // ১৫% কমিশন
            const totalCost = price + commission;

            const user = auth.currentUser;
            const userDoc = await db.collection("users").doc(user.uid).get();
            const balance = userDoc.data().balance;

            if(balance < totalCost) {
                alert("আপনার ওয়ালেটে পর্যাপ্ত টাকা নেই! কমিশন সহ মোট লাগবে: ৳" + totalCost);
                return;
            }

            // ব্যালেন্স কাটা এবং কাজ পাবলিশ করা
            await db.collection("users").doc(user.uid).update({ balance: balance - totalCost });
            await db.collection("jobs").add({
                title, price, link: document.getElementById('jobLink').value,
                sellerId: user.uid, status: 'available'
            });
            alert("কাজ সফলভাবে আপলোড হয়েছে! ১৫% কমিশন কেটে নেওয়া হয়েছে।");
        }
    </script>
</body>
</html>
