<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
    <div class="container">
        <div class="balance-box">
            <p>আপনার আয়</p>
            <h1 id="bal">0.00 ৳</h1>
        </div>
        <button class="btn-primary" onclick="location.href='task-list.html'">কাজ খুঁজুন</button>
        <button class="btn-primary" style="background:#dc3545;" onclick="location.href='withdraw.html'">টাকা তুলুন</button>
        <div class="bottom-nav">
            <a href="seller-dashboard.html" class="nav-item">🏠 হোম</a>
            <a href="task-list.html" class="nav-item">📋 কাজ</a>
            <a href="support.html" class="nav-item">📞 সাপোর্ট</a>
        </div>
    </div>
    <script src="config.js"></script>
    <script>
        auth.onAuthStateChanged(user => {
            db.collection("users").doc(user.uid).onSnapshot(doc => { document.getElementById('bal').innerText = doc.data().balance + " ৳"; });
        });
    </script>
</body>
</html>
