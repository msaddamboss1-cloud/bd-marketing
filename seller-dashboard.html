<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="config.js"></script>
<script src="global-logic.js"></script></head>
<body>
<header class="hud">
  <div><small>Balance</small><br><b id="balanceText">...</b></div>
  <button onclick="auth.signOut().then(()=>location.href='index.html')" style="width:auto;">Logout</button>
</header>
<div class="grid">
  <div class="glass-card" style="width:100%;"><a href="withdraw.html"><h3>Withdraw Money</h3></a></div>
  <div class="glass-card" style="width:100%;"><a href="history.html"><h3>History</h3></a></div>
  <div class="glass-card" style="width:100%;"><a href="support.html"><h3>Support</h3></a></div>
</div>
<h3 style="padding:20px;">Earn Money</h3>
<div id="tasks" class="grid"></div>
<script>
auth.onAuthStateChanged(u=>{
  if(!u) return location.href="index.html";
  trackBalance(u.uid);
  db.collection("tasks").where("status","==","open").onSnapshot(s=>{
    document.getElementById("tasks").innerHTML = s.docs.map(d=>`
      <div class="card"><h4>${d.data().title}</h4><p>Pay: ৳${d.data().budget}</p><a href="task-details.html?id=${d.id}">Start Task</a></div>
    `).join("");
  });
});
</script></body></html>
