<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
<div class="app-container">
    <div class="glass-card" style="text-align:center; border-bottom: 4px solid var(--primary);">
        <p style="color:var(--muted)">Current Balance</p>
        <h1 id="balance" style="font-size:40px; color:var(--primary)">৳0</h1>
        <button onclick="location.href='withdraw.html'" style="height:40px; margin-top:10px; width:120px; font-size:12px;">Withdraw</button>
    </div>

    <h3 style="margin: 20px 0 10px 5px;">🔥 Available Tasks</h3>
    <div id="taskList"></div>
</div>

<div class="bottom-nav">
    <a href="seller-dashboard.html" class="nav-item active">🏠 Home</a>
    <a href="history.html" class="nav-item">📜 History</a>
    <a href="support.html" class="nav-item">📞 Support</a>
</div>

<script src="config.js"></script>
<script>
auth.onAuthStateChanged(user => {
    if(!user) location.href="index.html";
    db.collection("users").doc(user.uid).onSnapshot(doc => {
        document.getElementById("balance").innerText = "৳" + (doc.data().balance || 0);
    });
    db.collection("tasks").where("status","==","open").onSnapshot(snap => {
        let html = "";
        snap.forEach(doc => {
            let t = doc.data();
            html += `<div class="glass-card" onclick="location.href='task-details.html?id=${doc.id}'">
                <h4>${t.title}</h4>
                <p style="color:var(--primary)">Reward: ৳${t.reward}</p>
            </div>`;
        });
        document.getElementById("taskList").innerHTML = html || "<p class='text-muted'>No tasks available</p>";
    });
});
</script>
</body>
</html>
