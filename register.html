<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | BD Marketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #080c14; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .input-box { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); }
        input::placeholder { color: #64748b; font-weight: 500; }
        .role-btn { background: rgba(15, 23, 42, 0.5); border: 2px solid rgba(59, 130, 246, 0.1); transition: 0.3s; }
        .role-btn.active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.2); transform: scale(1.05); }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-10">

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="glass-card w-full max-w-md p-10 rounded-[3rem] shadow-2xl">
            
            <div class="text-center mb-8">
                <h2 class="text-5xl font-black text-white uppercase italic tracking-tighter">JOIN US</h2>
                <p class="text-blue-500 text-[10px] uppercase font-black tracking-[0.3em] mt-3">CREATE YOUR BD MARKETING ACCOUNT</p>
            </div>

            <div class="flex gap-4 mb-8">
                <button onclick="setRole('worker')" id="workerBtn" class="role-btn active flex-1 p-4 rounded-2xl flex flex-col items-center gap-2">
                    <i class="fas fa-user-gear text-blue-500 text-xl"></i>
                    <span class="text-[10px] text-white font-black uppercase">Worker</span>
                </button>
                <button onclick="setRole('buyer')" id="sellerBtn" class="role-btn flex-1 p-4 rounded-2xl flex flex-col items-center gap-2">
                    <i class="fas fa-user-tie text-blue-500 text-xl"></i>
                    <span class="text-[10px] text-white font-black uppercase">Buyer</span>
                </button>
            </div>

            <form id="regForm" class="space-y-4">
                <div class="relative">
                    <i class="fas fa-user absolute left-5 top-1/2 -translate-y-1/2 text-blue-500"></i>
                    <input type="text" id="regName" required class="input-box w-full text-white pl-12 pr-4 py-4 rounded-2xl outline-none text-sm" placeholder="Full Name">
                </div>

                <div class="relative">
                    <i class="fas fa-phone absolute left-5 top-1/2 -translate-y-1/2 text-blue-500"></i>
                    <input type="number" id="regPhone" required class="input-box w-full text-white pl-12 pr-4 py-4 rounded-2xl outline-none text-sm" placeholder="Mobile Number">
                </div>

                <div class="relative">
                    <i class="fas fa-envelope absolute left-5 top-1/2 -translate-y-1/2 text-blue-500"></i>
                    <input type="email" id="regEmail" required class="input-box w-full text-white pl-12 pr-4 py-4 rounded-2xl outline-none text-sm" placeholder="Email Address">
                </div>

                <div class="relative">
                    <i class="fas fa-key absolute left-5 top-1/2 -translate-y-1/2 text-blue-500"></i>
                    <input type="password" id="regPass" required class="input-box w-full text-white pl-12 pr-14 py-4 rounded-2xl outline-none text-sm" placeholder="Password">
                    <button type="button" onclick="togglePassword()" class="absolute right-5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-blue-500">
                        <i id="eyeIcon" class="fas fa-eye text-lg"></i>
                    </button>
                </div>

                <div class="pt-4">
                    <button type="submit" id="regBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-5 rounded-[1.5rem] shadow-lg text-[12px] uppercase tracking-[0.2em] transition-all active:scale-95">
                        <span id="btnText">CREATE ACCOUNT</span>
                    </button>
                </div>
            </form>

            <div class="mt-8 text-center">
                <a href="index.html" class="text-gray-500 font-black uppercase text-[10px] hover:text-blue-500 tracking-widest">
                    ALREADY HAVE AN ACCOUNT? LOGIN
                </a>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // আপনার দেওয়া সঠিক ফায়ারবেস কনফিগ এখানে বসানো হয়েছে
        const firebaseConfig = {
            apiKey: "AIzaSyDRwrekZBZ31ACszDk2EJM_IqxRRwaGfCg",
            authDomain: "bd-marketing-55a81.firebaseapp.com",
            databaseURL: "https://bd-marketing-55a81-default-rtdb.firebaseio.com",
            projectId: "bd-marketing-55a81",
            storageBucket: "bd-marketing-55a81.firebasestorage.app",
            messagingSenderId: "678696512628",
            appId: "1:678696512628:web:edfc22a62f55dad41df521",
            measurementId: "G-3CP5DC4H44"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentRole = "worker";
        window.setRole = (role) => {
            currentRole = role;
            document.getElementById('workerBtn').classList.toggle('active', role === 'worker');
            document.getElementById('sellerBtn').classList.toggle('active', role === 'buyer');
        };

        document.getElementById('regForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const phone = document.getElementById('regPhone').value;
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPass').value;
            const btn = document.getElementById('regBtn');
            const txt = document.getElementById('btnText');

            txt.innerText = "CREATING...";
            btn.disabled = true;

            createUserWithEmailAndPassword(auth, email, pass)
            .then((userCredential) => {
                const uid = userCredential.user.uid;
                
                // ইউজার ডাটা ডাটাবেসে সেভ করা
                set(ref(db, 'users/' + uid), {
                    username: name,
                    phone: phone,
                    email: email,
                    role: currentRole,
                    balance: 0,
                    joinDate: new Date().toLocaleDateString()
                });

                // ফোন নম্বর ম্যাপ তৈরি (যাতে পরে শুধু ফোন দিয়ে লগইন করা যায়)
                set(ref(db, 'usersByPhone/' + phone), {
                    email: email,
                    uid: uid
                }).then(() => {
                    alert("Account Created Successfully!");
                    window.location.href = "index.html";
                });
            })
            .catch((error) => {
                alert(error.message);
                txt.innerText = "CREATE ACCOUNT";
                btn.disabled = false;
            });
        });
    </script>

    <script>
        function togglePassword() {
            const passInput = document.getElementById('regPass');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passInput.type = 'password';
                eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
    <script src="header.js"></script>
</body>
</html>
