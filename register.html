<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
<div class="app-container">
    <div class="glass-card">
        <h2 style="color:var(--primary)">Create Account</h2>
        <input id="email" placeholder="Email Address">
        <input id="pass" type="password" placeholder="Password (Min 6 characters)">
        <select id="role">
            <option value="seller">Become a Seller (Worker)</option>
            <option value="buyer">Become a Buyer (Client)</option>
        </select>
        <button onclick="register(email.value, pass.value, role.value, err)">SIGN UP</button>
        <div id="err" class="error-msg"></div>
        <p style="text-align:center; margin-top:15px; font-size:14px;">Already have an account? <a href="index.html" style="color:var(--primary)">Login</a></p>
    </div>
</div>
<script src="config.js"></script>
<script src="auth-engine.js"></script>
</body>
</html>
