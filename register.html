<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - BD Marketing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: #0f172a; color: white; font-family: sans-serif;">
    <div style="width: 90%; max-width: 400px; margin: 50px auto; padding: 25px; background: rgba(255,255,255,0.05); border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1);">
        <h2 style="color: #38bdf8;">নতুন অ্যাকাউন্ট তৈরি</h2>
        
        <input type="text" id="regName" placeholder="পুরো নাম" style="width: 100%; margin: 10px 0; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white;">
        <input type="email" id="regEmail" placeholder="ইমেইল" style="width: 100%; margin: 10px 0; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white;">
        <input type="password" id="regPass" placeholder="পাসওয়ার্ড (৬টি সংখ্যা)" style="width: 100%; margin: 10px 0; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white;">
        
        <select id="regRole" style="width: 100%; margin: 10px 0; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white;">
            <option value="seller">আমি সেলার (কাজ করব)</option>
            <option value="buyer">আমি বায়ার (কাজ দিব)</option>
        </select>
        
        <button id="regBtn" style="width: 100%; padding: 12px; background: #38bdf8; color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; font-size: 16px;">সাবমিট করুন</button>
        <p style="margin-top: 20px;">অ্যাকাউন্ট আছে? <a href="index.html" style="color: #38bdf8; text-decoration: none;">লগইন করুন</a></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        // আপনার দেওয়া নতুন কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyDRwrekZBZ31ACszDk2EJM_IqxRRwaGfCg",
            authDomain: "bd-marketing-55a81.firebaseapp.com",
            projectId: "bd-marketing-55a81",
            storageBucket: "bd-marketing-55a81.firebasestorage.app",
            messagingSenderId: "678696512628",
            appId: "1:678696512628:web:edfc22a62f55dad41df521"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById('regBtn').onclick = async () => {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value;
            const role = document.getElementById('regRole').value;
            const btn = document.getElementById('regBtn');

            if (!name || !email || !pass) { alert("সব তথ্য পূরণ করুন!"); return; }

            btn.innerText = "লোডিং..."; btn.disabled = true;

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, pass);
                await setDoc(doc(db, "users", cred.user.uid), {
                    name, email, role, balance: 0, depositBalance: 0, status: "active", createdAt: serverTimestamp()
                });
                alert("রেজিস্ট্রেশন সফল!");
                window.location.href = 'dashboard.html';
            } catch (error) {
                alert("ভুল হয়েছে: " + error.message);
                btn.innerText = "সাবমিট করুন"; btn.disabled = false;
            }
        };
    </script>
</body>
</html>
