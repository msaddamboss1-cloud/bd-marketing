<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - BD Marketing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-card" style="width: 90%; max-width: 400px; margin: auto; margin-top: 50px;">
        <h2 style="color: var(--accent);">অ্যাকাউন্ট তৈরি করুন</h2>
        <div id="form-container">
            <input type="text" id="regName" placeholder="আপনার নাম" class="input-field">
            <input type="email" id="regEmail" placeholder="আপনার ইমেইল" class="input-field">
            <input type="password" id="regPass" placeholder="পাসওয়ার্ড (৬টি সংখ্যা)" class="input-field">
            <select id="regRole" class="input-field">
                <option value="seller">আমি কাজ করব (Seller)</option>
                <option value="buyer">আমি কাজ দিব (Buyer)</option>
            </select>
            <button id="regBtn" class="btn-primary" style="cursor: pointer; position: relative; z-index: 100;">সাবমিট করুন</button>
        </div>
        <p style="margin-top: 15px;">ইতিমধ্যে অ্যাকাউন্ট আছে? <a href="index.html" style="color: var(--accent);">লগইন</a></p>
    </div>

    <script type="module">
        import { auth, db } from './config.js';
        import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        // বাটন ক্লিক ফাংশন
        const registerUser = async () => {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value;
            const role = document.getElementById('regRole').value;
            const btn = document.getElementById('regBtn');

            if (!name || !email || !pass) {
                alert("সবগুলো ঘর পূরণ করুন!");
                return;
            }

            if (pass.length < 6) {
                alert("পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে!");
                return;
            }

            try {
                btn.innerText = "লোডিং...";
                btn.disabled = true;

                // ১. ইউজার ক্রিয়েট
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;

                // ২. ডাটাবেসে সেভ করা
                await setDoc(doc(db, "users", user.uid), {
                    name: name,
                    email: email,
                    role: role,
                    balance: 0,
                    depositBalance: 0,
                    status: "active",
                    createdAt: serverTimestamp()
                });

                alert("রেজিস্ট্রেশন সফল হয়েছে!");
                window.location.href = 'dashboard.html';

            } catch (error) {
                console.error(error);
                btn.innerText = "সাবমিট করুন";
                btn.disabled = false;
                
                if (error.code === 'auth/email-already-in-use') {
                    alert("এই ইমেইলটি আগে ব্যবহার করা হয়েছে!");
                } else {
                    alert("সমস্যা হয়েছে: " + error.message);
                }
            }
        };

        // বাটনে ক্লিক লিসেনার যুক্ত করা
        document.getElementById('regBtn').addEventListener('click', registerUser);
    </script>
</body>
</html>
