<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration - BD Marketing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: #0f172a; color: white; font-family: sans-serif;">
    <div style="width: 90%; max-width: 400px; margin: 50px auto; padding: 25px; background: rgba(255,255,255,0.05); border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1);">
        <h2 style="color: #38bdf8;">নতুন অ্যাকাউন্ট তৈরি</h2>
        
        <input type="text" id="regName" placeholder="আপনার পুরো নাম" style="width: 100%; margin: 10px 0; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white;">
        <input type="email" id="regEmail" placeholder="আপনার ইমেইল" style="width: 100%; margin: 10px 0; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white;">
        <input type="password" id="regPass" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ ডিজিট)" style="width: 100%; margin: 10px 0; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white;">
        
        <select id="regRole" style="width: 100%; margin: 10px 0; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white;">
            <option value="seller">আমি সেলার (কাজ করতে চাই)</option>
            <option value="buyer">আমি বায়ার (কাজ দিতে চাই)</option>
        </select>
        
        <button id="regBtn" style="width: 100%; padding: 12px; background: #38bdf8; color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; font-size: 16px;">সাবমিট করুন</button>
        
        <p style="margin-top: 20px;">অ্যাকাউন্ট আছে? <a href="index.html" style="color: #38bdf8; text-decoration: none;">লগইন করুন</a></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        // আপনার ৩য় স্ক্রিনশট অনুযায়ী ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyAs76m-84F4S3A9O4J7_G9R7K6L5M4N3P2", 
            authDomain: "bd-marketing-55a81.firebaseapp.com",
            projectId: "bd-marketing-55a81",
            storageBucket: "bd-marketing-55a81.appspot.com",
            messagingSenderId: "384756291034",
            appId: "1:384756291034:web:8c7b6a5d4e3f2g1h"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // বাটন ক্লিক ইভেন্ট
        document.getElementById('regBtn').onclick = async () => {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value;
            const role = document.getElementById('regRole').value;
            const btn = document.getElementById('regBtn');

            if (!name || !email || !pass) {
                alert("দয়া করে সব ঘর পূরণ করুন!");
                return;
            }

            btn.innerText = "লোডিং...";
            btn.disabled = true;

            try {
                // ইউজার তৈরি
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;

                // ডাটাবেসে তথ্য রাখা
                await setDoc(doc(db, "users", user.uid), {
                    name: name,
                    email: email,
                    role: role,
                    balance: 0,
                    depositBalance: 0,
                    status: "active",
                    createdAt: serverTimestamp()
                });

                alert("রেজিস্ট্রেশন সফল হয়েছে!");
                window.location.href = 'dashboard.html';

            } catch (error) {
                btn.innerText = "সাবমিট করুন";
                btn.disabled = false;
                alert("ভুল হয়েছে: " + error.message);
            }
        };
    </script>
</body>
</html>
