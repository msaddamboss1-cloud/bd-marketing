<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Register</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
  <script src="config.js"></script>
  <script defer src="auth-engine.js"></script>
</head>
<body class="auth-body">
  <div class="glass-card">
    <h2>Join Now</h2>
    <input id="regName" placeholder="Your Full Name" />
    <input id="regEmail" placeholder="Email Address" />
    <input id="regPassword" type="password" placeholder="Password (6+ chars)" />
    <select id="regRole">
      <option value="">Select Account Type</option>
      <option value="buyer">Buyer (I want to post jobs)</option>
      <option value="seller">Seller (I want to earn)</option>
    </select>
    <button onclick="registerUser()">Sign Up</button>
    <a href="index.html" class="muted">Back to Login</a>
  </div>
</body>
</html>
