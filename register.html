<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | BD Marketing</title>
    <style>
        :root { --primary: #1e3c72; --accent: #2ecc71; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: var(--primary); display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .card { background: white; width: 90%; max-width: 400px; padding: 30px; border-radius: 25px; text-align: center; }
        h2 { color: var(--primary); margin-bottom: 5px; }
        h3 { color: var(--accent); margin-bottom: 25px; }

        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px; outline: none; }
        
        .btn-submit { width: 100%; background: var(--accent); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; }
        
        .footer-text { margin-top: 15px; font-size: 13px; color: #666; }
        .footer-text a { color: var(--primary); font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>BD MARKETING</h2>
        <h3>রেজিস্ট্রেশন করুন</h3>

        <form id="regForm">
            <input type="text" placeholder="আপনার পুরো নাম" required>
            <input type="email" id="userEmail" placeholder="ইমেইল এড্রেস" required>
            <input type="number" placeholder="মোবাইল নম্বর (বিকাশ/নগদ)" required>
            
            <select id="userRole" required>
                <option value="" disabled selected>আপনার রোল সিলেক্ট করুন</option>
                <option value="worker">ওয়ার্কার (আমি কাজ করবো)</option>
                <option value="buyer">বায়ার (আমি কাজ দেবো)</option>
            </select>

            <input type="password" placeholder="নতুন পাসওয়ার্ড দিন" required>
            
            <button type="submit" class="btn-submit">অ্যাকাউন্ট তৈরি করুন</button>
        </form>

        <div class="footer-text">
            ইতিমধ্যেই অ্যাকাউন্ট আছে? <a href="login.html">লগইন</a>
        </div>
    </div>

    <script>
        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const role = document.getElementById('userRole').value;
            
            // রোল অনুযায়ী রিডাইরেক্ট লজিক
            if (role === 'worker') {
                window.location.href = 'worker.html'; // ওয়ার্কার ড্যাশবোর্ডে পাঠাবে
            } else if (role === 'buyer') {
                window.location.href = 'buyer.html'; // বায়ার ড্যাশবোর্ডে পাঠাবে
            }
        });
    </script>

</body>
</html>
