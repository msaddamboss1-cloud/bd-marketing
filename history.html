<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity History - BD Marketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { background: #0b1222; font-family: 'Inter', sans-serif; color: white; margin: 0; padding: 0; }
        .history-card { background: rgba(30, 41, 59, 0.4); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 16px; margin-bottom: 15px; transition: 0.3s; }
        .status-badge { font-size: 9px; font-weight: 900; text-transform: uppercase; padding: 4px 10px; border-radius: 8px; letter-spacing: 0.5px; }
        .pending { color: #fbbf24; background: rgba(251, 191, 36, 0.1); }
        .success { color: #34d399; background: rgba(52, 211, 153, 0.1); }
        .rejected { color: #f87171; background: rgba(248, 113, 113, 0.1); }
        .info-row { display: flex; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); border-top-style: dashed; }
        .info-label { font-size: 9px; color: #64748b; font-weight: bold; text-transform: uppercase; }
        .info-value { font-size: 10px; color: #cbd5e1; font-weight: 600; }
    </style>
</head>
<body class="p-6">

    <!-- Header & Dynamic Back Button -->
    <header class="flex items-center gap-4 mb-8">
        <button id="back-btn" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/5 border border-white/10 active:scale-90 transition">
            <i class="fas fa-chevron-left text-gray-400"></i>
        </button>
        <div>
            <h1 class="text-[10px] font-black uppercase tracking-[3px] text-blue-500">Transaction</h1>
            <h2 class="text-xs font-bold text-gray-400 uppercase">Activity History</h2>
        </div>
    </header>

    <!-- History List -->
    <div id="history-list" class="max-w-md mx-auto">
        <div class="text-center py-20">
            <i class="fas fa-circle-notch fa-spin text-blue-600 text-2xl mb-4"></i>
            <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Loading Records...</p>
        </div>
    </div>

    <!-- Firebase System -->
    <script type="module">
        // Import Firebase Functions
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDRwrekZBZ31ACszDk2EJM_IqxRRwaGfCg",
            authDomain: "bd-marketing-55a81.firebaseapp.com",
            databaseURL: "https://bd-marketing-55a81-default-rtdb.firebaseio.com",
            projectId: "bd-marketing-55a81",
            storageBucket: "bd-marketing-55a81.firebasestorage.app",
            messagingSenderId: "678696512628",
            appId: "1:678696512628:web:edfc22a62f55dad41df521",
            measurementId: "G-3CP5DC4H44"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getDatabase(app);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                // ১. ব্যাক বাটন লজিক: রোল অনুযায়ী ড্যাশবোর্ড সিলেকশন
                onValue(ref(db, `users/${user.uid}/role`), (snap) => {
                    const role = snap.val();
                    const backBtn = document.getElementById('back-btn');
                    
                    backBtn.onclick = () => {
                        // ইউজার রোল অনুযায়ী সঠিক ফাইলে পাঠানো
                        if (role === 'Buyer') {
                            window.location.href = "buyer_dashboard.html";
                        } else if (role === 'Seller') {
                            window.location.href = "worker_dashboard.html";
                        } else {
                            // রোল খুঁজে না পেলে ব্রাউজার ব্যাক
                            window.history.back();
                        }
                    };
                });

                // ২. উইথড্র হিস্ট্রি ডাটা রিড করা
                const historyRef = ref(db, `users/${user.uid}/withdraw_history`);
                onValue(historyRef, (snapshot) => {
                    const container = document.getElementById('history-list');
                    container.innerHTML = "";

                    if (snapshot.exists()) {
                        const logs = snapshot.val();
                        // নতুন ডাটা সবার উপরে দেখানোর জন্য সর্টিং
                        const keys = Object.keys(logs).reverse();

                        keys.forEach(id => {
                            const data = logs[id];
                            const statusStyle = data.status ? data.status.toLowerCase() : 'pending';
                            
                            container.innerHTML += `
                                <div class="history-card">
                                    <div class="flex justify-between items-center mb-2">
                                        <div class="flex items-center gap-3">
                                            <div class="w-10 h-10 rounded-xl bg-blue-500/10 flex items-center justify-center text-blue-500">
                                                <i class="fas fa-money-bill-transfer text-xs"></i>
                                            </div>
                                            <div>
                                                <h3 class="text-[10px] font-black uppercase text-gray-200">${data.method || 'Withdraw'}</h3>
                                                <span class="status-badge ${statusStyle}">${data.status || 'Pending'}</span>
                                            </div>
                                        </div>
                                        <p class="text-sm font-black">৳${data.amount || '0'}</p>
                                    </div>
                                    <div class="info-row">
                                        <div><p class="info-label">Date</p><p class="info-value">${new Date().toLocaleDateString()}</p></div>
                                        <div class="text-right">
                                            <p class="info-label">Info</p>
                                            <p class="info-value">${data.number || 'No Number'}</p>
                                        </div>
                                    </div>
                                </div>`;
                        });
                    } else {
                        container.innerHTML = `<div class="text-center py-20 opacity-20"><i class="fas fa-inbox text-5xl mb-4"></i><p class="text-xs font-black uppercase">No Data Found</p></div>`;
                    }
                });
            } else {
                // লগইন করা না থাকলে লগইন পেজে রিডাইরেক্ট
                window.location.href = "login.html";
            }
        });
    </script>
</body>
</html>
