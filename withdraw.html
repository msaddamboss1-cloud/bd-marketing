<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw - BD Marketing</title><link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-card">
        <h3>টাকা উত্তোলন (Withdraw)</h3>
        <p style="font-size: 0.8em; color: var(--accent);">সর্বনিম্ন উইথড্র: ৳৫০</p>
        
        <input type="number" id="wAmount" placeholder="টাকার পরিমাণ (৳)" class="input-field">
        <select id="wMethod" class="input-field">
            <option value="bkash">Bkash Personal</option>
            <option value="nagad">Nagad Personal</option>
        </select>
        <input type="text" id="wNumber" placeholder="আপনার বিকাশ/নগদ নম্বর" class="input-field">
        
        <button id="withdrawBtn" class="btn-primary">উইথড্র রিকোয়েস্ট পাঠান</button>
    </div>

    <script type="module">
        import { auth, db } from './config.js';
        import { doc, getDoc, addDoc, collection, updateDoc, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        document.getElementById('withdrawBtn').onclick = async () => {
            const amt = Number(document.getElementById('wAmount').value);
            const num = document.getElementById('wNumber').value;
            const method = document.getElementById('wMethod').value;

            if(amt < 50) { alert("মিনিমাম ৫০ টাকা হতে হবে!"); return; }
            if(!num) { alert("নম্বর দিন!"); return; }

            const userRef = doc(db, "users", auth.currentUser.uid);
            const userSnap = await getDoc(userRef);
            
            if(userSnap.data().balance < amt) { alert("আপনার ব্যালেন্স পর্যাপ্ত নয়!"); return; }

            // ব্যালেন্স কেটে নেওয়া এবং রিকোয়েস্ট সেভ করা
            await updateDoc(userRef, { balance: increment(-amt) });
            await addDoc(collection(db, "withdraw_requests"), {
                uid: auth.currentUser.uid,
                email: auth.currentUser.email,
                amount: amt,
                number: num,
                method: method,
                status: "pending",
                timestamp: serverTimestamp()
            });

            alert("রিকোয়েস্ট সফল! ১২-২৪ ঘণ্টার মধ্যে পেমেন্ট পাবেন।");
            window.location.href = 'seller-home.html';
        };
    </script>
</body>
</html>
