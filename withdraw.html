<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
<div class="app-container">
    <div class="glass-card">
        <h2>Withdraw Funds</h2>
        <input id="amt" type="number" placeholder="Amount to withdraw">
        <input id="phone" placeholder="Nagad/Bkash Number">
        <select id="method"><option>Nagad</option><option>Bkash</option></select>
        <button onclick="reqW()">Send Request</button>
        <p id="msg" class="error-msg"></p>
    </div>
</div>
<script src="config.js"></script>
<script>
async function reqW() {
    const user = auth.currentUser;
    const snap = await db.collection("users").doc(user.uid).get();
    if(Number(amt.value) > snap.data().balance) return msg.innerText="Insufficient Balance!";
    
    await db.collection("transactions").add({
        type:"withdraw", uid:user.uid, amount:Number(amt.value), phone:phone.value, method:method.value, status:"pending", createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    alert("Request Sent!"); location.href="seller-dashboard.html";
}
</script>
</body>
</html>
