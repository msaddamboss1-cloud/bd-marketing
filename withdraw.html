<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
    <div class="container">
        <h3>টাকা উত্তোলন করুন</h3>
        <input type="number" id="wAmt" placeholder="টাকার পরিমাণ (৳)">
        <input type="text" id="wNum" placeholder="বিকাশ/নগদ নম্বর">
        <select id="wMethod"><option>Bkash</option><option>Nagad</option></select>
        <button class="btn-primary" style="background:#e74c3c;" onclick="out()">উত্তোলন রিকোয়েস্ট পাঠান</button>
    </div>
    <script src="config.js"></script>
    <script>
        function out(){
            const a=document.getElementById('wAmt').value, n=document.getElementById('wNum').value, m=document.getElementById('wMethod').value;
            if(!a || !n) { alert("সব তথ্য দিন"); return; }
            db.collection("users").doc(auth.currentUser.uid).get().then(doc=>{
                if(doc.data().balance < a) alert("আপনার ব্যালেন্স কম!");
                else {
                    db.collection("withdraws").add({uid:auth.currentUser.uid, email:auth.currentUser.email, amount:parseFloat(a), number:n, method:m, status:"pending", date:new Date()}).then(()=>{
                        db.collection("users").doc(auth.currentUser.uid).update({balance: firebase.firestore.FieldValue.increment(-a)});
                        alert("রিকোয়েস্ট সফল! ১২-২৪ ঘণ্টার মধ্যে পেমেন্ট পাবেন।"); history.back();
                    });
                }
            });
        }
    </script>
</body>
</html>
