<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Market - Ultra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #000; color: white; font-family: 'Inter', sans-serif; }
        .job-card { background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01)); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; transition: 0.3s; }
        .job-card:hover { border-color: #3b82f6; background: rgba(59, 130, 246, 0.05); }
        .badge { background: rgba(59, 130, 246, 0.2); color: #3b82f6; padding: 4px 10px; border-radius: 10px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body class="pb-20">
    <header class="sticky top-0 z-50 bg-black/80 backdrop-blur-md border-b border-white/5 p-5 flex items-center justify-between">
        <div class="flex items-center space-x-4">
            <button onclick="window.location.href='home.html'" class="w-10 h-10 flex items-center justify-center bg-white/5 rounded-full border border-white/10">
                <i class="fas fa-chevron-left"></i>
            </button>
            <h2 class="text-lg font-black italic">পকেট মার্কেট</h2>
        </div>
        <div class="text-right">
            <p class="text-[9px] text-gray-500 uppercase">আপনার ব্যালেন্স</p>
            <p id="sellerBalance" class="text-blue-500 font-bold">৳ 0.00</p>
        </div>
    </header>

    <main class="p-6 space-y-8">
        <div class="job-card p-6">
            <div class="flex items-center space-x-3 mb-6">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                    <i class="fas fa-plus text-white text-xs"></i>
                </div>
                <h3 class="font-bold text-sm">নতুন কাজ পাবলিশ করুন</h3>
            </div>
            
            <div class="space-y-4">
                <input type="text" id="jobTitle" placeholder="কাজের নাম (যেমন: ইউটিউব সাবস্ক্রাইব)" class="w-full bg-white/5 p-4 rounded-2xl outline-none border border-white/10 text-sm focus:border-blue-500 transition">
                <input type="number" id="jobPay" placeholder="জনপ্রতি পেমেন্ট (যেমন: ৫ টাকা)" class="w-full bg-white/5 p-4 rounded-2xl outline-none border border-white/10 text-sm focus:border-blue-500 transition">
                <button onclick="postNewJob()" class="w-full bg-blue-600 py-4 rounded-2xl font-black text-xs uppercase tracking-widest active:scale-95 transition-all shadow-lg shadow-blue-500/20">মার্কেটে ছাড়ুন</button>
            </div>
        </div>

        <div class="space-y-4">
            <div class="flex items-center justify-between px-2">
                <h4 class="text-xs font-black text-gray-500 uppercase tracking-widest">চলমান কাজসমূহ</h4>
                <div class="flex items-center space-x-2">
                    <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                    <span class="text-[10px] text-green-500">LIVE</span>
                </div>
            </div>
            
            <div id="jobList" class="space-y-4">
                <div class="text-center py-10">
                    <i class="fas fa-spinner fa-spin text-blue-500 mb-2"></i>
                    <p class="text-[10px] text-gray-600 italic">নতুন কাজ খোঁজা হচ্ছে...</p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="master-engine.js?v=AL-2.0"></script>
</body>
</html>
