<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD Marketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; }
    </style>
</head>
<body>

    <header class="fixed top-0 w-full z-50">
        <div class="bg-blue-600 text-center py-2 text-[10px] font-bold">
            বিকাশ: 01725780575 | নগদ: 01763584939 | লিমিট: ৫০-৫০০০৳
        </div>
        <nav class="bg-black/90 p-4 flex justify-between items-center border-b border-gray-900">
            <i class="fas fa-bars text-blue-500 text-xl" onclick="toggleSidebar()"></i>
            <div class="text-center">
                <h1 class="font-bold text-lg">BD MARKETING</h1>
                <p class="text-[9px] text-gray-500">এডমিন: সাদ্দাম <span class="text-green-500">●</span></p>
            </div>
            <div class="text-[10px] text-gray-400">WiFi 100%</div>
        </nav>
    </header>

    <main class="pt-28 px-6">
        <h2 class="text-lg font-bold mb-6">স্বাগতম, জনাব।</h2>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="glass-card p-5 border-b-4 border-red-600">
                <p class="text-[9px] text-red-400 font-bold uppercase">বিক্রেতা (Employer)</p>
                <h3 class="text-xl font-black mt-1">৳ <span id="sellerBalance">0.00</span></h3>
            </div>
            <div class="glass-card p-5 border-b-4 border-green-600">
                <p class="text-[9px] text-green-400 font-bold uppercase">ক্রেতা (Worker)</p>
                <h3 class="text-xl font-black mt-1">৳ <span id="buyerBalance">0.00</span></h3>
            </div>
        </div>

        <div class="glass-card p-6">
            <h4 class="text-sm font-bold mb-4 text-blue-500">নিরাপদ লেনদেন ফরম</h4>
            <select id="depositMode" class="w-full bg-gray-900 p-4 rounded-xl mb-4 text-sm outline-none">
                <option value="seller">আমি বিক্রেতা (আমি কাজ দিতে চাই)</option>
                <option value="buyer">আমি ক্রেতা (আমি কাজ করতে চাই)</option>
            </select>
            <input type="number" id="depositAmt" placeholder="টাকার পরিমাণ (৫০-৫০০০)" class="w-full bg-gray-900 p-4 rounded-xl mb-4 text-sm outline-none">
            <input type="text" id="depositTrx" placeholder="ট্রানজেকশন আইডি (TrxID)" class="w-full bg-gray-900 p-4 rounded-xl mb-6 text-sm outline-none">
            <button onclick="handleDeposit()" class="w-full bg-blue-600 py-4 rounded-xl font-bold uppercase">রিকোয়েস্ট পাঠান</button>
        </div>
    </main>

    <div id="sidebar" class="fixed top-0 left-[-300px] w-[280px] h-full bg-black z-[100] transition-all border-r border-gray-800 p-6">
        <div class="flex justify-between items-center mb-10">
            <h2 class="font-bold text-blue-500">মেনু অপশন</h2>
            <i class="fas fa-times" onclick="toggleSidebar()"></i>
        </div>
        <div class="glass-card p-4 mb-6">
            <p class="text-[10px] text-gray-500">প্রোফাইল</p>
            <p id="userEmail" class="text-xs font-bold italic">লোড হচ্ছে...</p>
        </div>
        <button onclick="auth.signOut().then(()=>location.href='index.html')" class="text-red-500 font-bold">লগআউট করুন</button>
    </div>
    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 hidden z-[90]"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="master-engine.js"></script>
</body>
</html>
