<!DOCTYPE html><html><head><link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="config.js"></script>
<script src="global-logic.js"></script></head>
<body><div class="hud"><h3>Deposit Requests</h3><a href="admin-panel.html">Back</a></div>
<div id="list" class="grid"></div>
<script>
db.collection("deposits").where("status","==","pending").onSnapshot(s=>{
  document.getElementById("list").innerHTML = s.docs.map(d=>`
    <div class="card">
      <p><b>৳${d.data().amount}</b> via ${d.data().method}</p>
      <p>TRX: ${d.data().trxId}</p>
      <button onclick="ok('${d.id}','${d.data().userId}',${d.data().amount})">Approve</button>
    </div>`).join("");
});
function ok(id,uid,amt){
  db.collection("deposits").doc(id).update({status:"approved"});
  addBalance(uid, amt);
}
</script></body></html>
