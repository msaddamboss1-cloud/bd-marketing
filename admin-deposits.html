<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
<div class="app-container">
    <h2 style="margin-bottom:20px;">Pending Deposits</h2>
    <div id="list"></div>
</div>

<script src="config.js"></script>
<script>
db.collection("transactions")
  .where("type","==","deposit")
  .where("status","==","pending")
  .onSnapshot(snap => {
    const list = document.getElementById("list");
    list.innerHTML = "";
    snap.forEach(d => {
        const t = d.data();
        list.innerHTML += `
        <div class="glass-card">
            <p><b>User:</b> ${t.email}</p>
            <p><b>Amount:</b> ৳${t.amount}</p>
            <p><b>Method:</b> ${t.method}</p>
            <p><b>TRX:</b> ${t.trxId}</p>
            <button onclick="approve('${d.id}', '${t.uid}', ${t.amount})">APPROVE</button>
        </div>`;
    });
});

async function approve(docId, userId, amount) {
    const userRef = db.collection("users").doc(userId);
    
    await db.runTransaction(async (transaction) => {
        const userDoc = await transaction.get(userRef);
        const newBalance = (userDoc.data().balance || 0) + amount;
        transaction.update(userRef, { balance: newBalance });
        transaction.update(db.collection("transactions").doc(docId), { status: "approved" });
    });
    alert("Balance Added!");
}
</script>
</body>
</html>
