<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
    <div class="container">
        <h3>ডিপোজিট চেক:</h3>
        <div id="dList">লোড হচ্ছে...</div>
    </div>
    <script src="config.js"></script>
    <script>
        db.collection("deposits").where("status","==","pending").onSnapshot(snap=>{
            let h=""; snap.forEach(doc=>{
                let d=doc.data();
                h+=`<div class='card'>${d.email}<br><b>${d.amount}৳</b> (${d.method})<br>Trx:${d.trx}<br>
                <button onclick="app('${doc.id}','${d.uid}',${d.amount})">Approve</button></div>`;
            });
            document.getElementById('dList').innerHTML=h || "কোনো রিকোয়েস্ট নেই";
        });
        function app(id, uid, amt){
            db.collection("users").doc(uid).update({balance: firebase.firestore.FieldValue.increment(amt)});
            db.collection("deposits").doc(id).update({status:"approved"});
            alert("ডিপোজিট অ্যাপ্রুভ হয়েছে!");
        }
    </script>
</body>
</html>
