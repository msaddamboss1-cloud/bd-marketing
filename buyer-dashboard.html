<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
<div class="app-container">
    <div class="glass-card">
        <h3>Welcome, Buyer!</h3>
        <button onclick="location.href='post-job.html'">+ Post A New Task</button>
    </div>
    <h3>My Posted Jobs</h3>
    <div id="myJobs"></div>
</div>

<div class="bottom-nav">
    <a href="buyer-dashboard.html" class="nav-item active">🏠 Home</a>
    <a href="history.html" class="nav-item">📜 History</a>
    <a href="support.html" class="nav-item">📞 Support</a>
</div>

<script src="config.js"></script>
<script>
auth.onAuthStateChanged(user => {
    db.collection("tasks").where("buyer","==",user.uid).onSnapshot(snap => {
        let html = "";
        snap.forEach(doc => {
            html += `<div class="glass-card"><h4>${doc.data().title}</h4><p>Status: ${doc.data().status}</p></div>`;
        });
        document.getElementById("myJobs").innerHTML = html || "No jobs posted yet.";
    });
});
</script>
</body>
</html>
