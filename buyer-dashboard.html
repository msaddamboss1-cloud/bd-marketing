<div class="card">
    <h3>আপনার জন্য উপলব্ধ কাজসমূহ (ক্রেতা প্যানেল)</h3>
    <div id="jobList">চেক করা হচ্ছে...</div>
</div>

<script>
db.collection("jobs").where("status", "==", "available").onSnapshot(snap => {
    const list = document.getElementById('jobList');
    list.innerHTML = "";
    if(snap.empty) {
        list.innerHTML = "<p style='text-align:center'>বর্তমানে এই সাইটে কোন কাজ নেই।</p>";
        return;
    }
    snap.forEach(doc => {
        const job = doc.data();
        list.innerHTML += `
            <div class="job-card" style="border-left: 5px solid #10b981;">
                <h4>${job.title}</h4>
                <p>পেমেন্ট পাবেন: ৳${job.price}</p>
                <button class="btn buyer-btn" onclick="window.open('${job.link}')">কাজটি সম্পন্ন করুন</button>
            </div>`;
    });
});
</script>
