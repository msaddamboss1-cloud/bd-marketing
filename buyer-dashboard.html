
<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="config.js"></script></head>
<body>
<header class="hud"><h3>Buyer Panel</h3><button onclick="auth.signOut().then(()=>location.href='index.html')" style="width:auto;">Logout</button></header>
<div class="grid">
  <div class="glass-card" style="width:100%;"><a href="post-job.html"><h3>+ Post New Job</h3></a></div>
  <div class="glass-card" style="width:100%;"><a href="deposit.html"><h3>Add Funds</h3></a></div>
  <div class="glass-card" style="width:100%;"><a href="support.html"><h3>Support</h3></a></div>
</div>
<h3 style="padding:20px;">My Jobs</h3>
<div id="jobs" class="grid"></div>
<script>
auth.onAuthStateChanged(u=>{
  if(!u) return location.href="index.html";
  db.collection("tasks").where("buyerId","==",u.uid).onSnapshot(s=>{
    document.getElementById("jobs").innerHTML = s.docs.map(d=>`
      <div class="card"><h4>${d.data().title}</h4><p>${d.data().status}</p><a href="task-details.html?id=${d.id}">View Proofs</a></div>
    `).join("");
  });
});
</script></body></html>
