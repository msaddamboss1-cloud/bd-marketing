<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BD-MARKETING | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #050810; color: #f8fafc; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sidebar { position: fixed; right: -280px; top: 0; width: 280px; height: 100%; background: #0b0f1a; transition: 0.4s ease; z-index: 1000; border-left: 1px solid rgba(59, 130, 246, 0.1); }
        .sidebar.active { right: 0; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 999; }
        .overlay.active { display: block; }
    </style>
</head>
<body class="pb-32">

    <div id="overlay" class="overlay"></div>
    
    <div id="sidebar" class="sidebar shadow-2xl">
        <div class="p-8 border-b border-white/5 bg-slate-900/30 text-right">
            <h1 class="text-xl font-black text-blue-500 italic">MENU PANEL</h1>
            <p class="text-[9px] text-slate-500 font-bold mt-1 uppercase tracking-widest italic text-blue-400">Admin: Saddam</p>
        </div>
        <div class="py-6 flex flex-col gap-1">
            <div onclick="location.href='profile.html'" class="flex items-center justify-end gap-4 px-6 py-4 text-slate-400 hover:text-blue-400 transition cursor-pointer">
                <span class="font-bold text-sm">প্রোফাইল</span> <i class="fas fa-user-circle text-lg"></i>
            </div>
            <div onclick="location.href='history.html'" class="flex items-center justify-end gap-4 px-6 py-4 text-slate-400 hover:text-blue-400 transition cursor-pointer">
                <span class="font-bold text-sm">কাজের হিস্ট্রি</span> <i class="fas fa-history text-lg"></i>
            </div>
            <div onclick="location.href='notice.html'" class="flex items-center justify-end gap-4 px-6 py-4 text-slate-400 hover:text-blue-400 transition cursor-pointer">
                <span class="font-bold text-sm">নোটিশ বোর্ড</span> <i class="fas fa-bullhorn text-lg"></i>
            </div>
            <div onclick="logoutAction()" class="flex items-center justify-end gap-4 px-6 py-4 text-red-500 transition cursor-pointer">
                <span class="font-bold text-sm">লগআউট</span> <i class="fas fa-power-off text-lg"></i>
            </div>
        </div>
    </div>

    <header class="p-6 pt-10">
        <div class="flex justify-between items-center mb-6">
            <div class="text-left">
                <h1 class="text-xl font-black italic text-blue-500 tracking-tighter">BD-MARKETING</h1>
                <p class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mt-0.5 italic">Admin: Saddam</p>
            </div>
            <button id="menuBtn" class="h-10 w-10 glass rounded-xl flex items-center justify-center text-blue-500 shadow-lg active:scale-90 transition">
                <i class="fas fa-bars-staggered text-lg"></i>
            </button>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4">
            <div class="glass p-4 rounded-3xl border-l-4 border-blue-500 shadow-xl">
                <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest mb-1">Main Balance</p>
                <h2 class="text-xl font-black text-white italic">৳ <span id="mainBalance">0.00</span></h2>
            </div>
            <div class="glass p-4 rounded-3xl border-l-4 border-orange-500 shadow-xl">
                <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest mb-1">Pending</p>
                <h2 class="text-xl font-black text-white italic">৳ <span id="pendingBalance">0.00</span></h2>
            </div>
        </div>

        <div class="glass py-2 px-4 rounded-xl flex items-center gap-3 bg-red-500/5 border-red-500/10">
            <i class="fas fa-bolt text-[10px] text-red-500 animate-pulse"></i>
            <marquee id="scrollingNotice" class="text-[10px] font-bold text-slate-400" scrollamount="3">লোড হচ্ছে...</marquee>
        </div>
    </header>

    <main class="px-6">
        <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4 flex items-center gap-2">
            <i class="fas fa-rocket text-blue-500"></i> Available Micro Jobs
        </h3>
        <div id="taskList" class="space-y-3">
            </div>
    </main>

    <div class="fixed bottom-0 left-0 right-0 p-6 z-50">
        <div class="glass max-w-[260px] mx-auto rounded-full px-2 py-2 flex justify-between items-center bg-slate-900/95 border border-white/10 shadow-2xl">
            <button onclick="location.href='buyer_home.html'" class="flex-1 flex flex-col items-center gap-1 text-blue-500">
                <i class="fas fa-house text-base"></i>
                <span class="text-[8px] font-black uppercase">Home</span>
            </button>
            <div class="h-5 w-[1px] bg-white/10"></div>
            <button onclick="location.href='withdraw.html'" class="flex-1 flex flex-col items-center gap-1 text-slate-500">
                <i class="fas fa-wallet text-base"></i>
                <span class="text-[8px] font-black uppercase">Withdraw</span>
            </button>
        </div>
    </div>

    <script type="module">
        // ... (আপনার আগের Firebase Logic এখানে থাকবে) ...
        // শুধু মেনু কন্ট্রোলের জন্য নিচের অংশটুকু আপডেট করে নিন:
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        menuBtn.onclick = () => { sidebar.classList.add('active'); overlay.classList.add('active'); }
        overlay.onclick = () => { sidebar.classList.remove('active'); overlay.classList.remove('active'); }
    </script>
</body>
</html>
