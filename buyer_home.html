<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD Marketing | Premium Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #020617; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .nav-active { color: #3b82f6; position: relative; }
        .nav-active::after { content: ''; position: absolute; bottom: -5px; width: 5px; height: 5px; background: #3b82f6; border-radius: 50%; }
    </style>
</head>
<body class="pb-28">

    <header class="p-6 bg-slate-900/80 rounded-b-[40px] border-b border-blue-500/10 shadow-2xl">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black bg-gradient-to-r from-blue-400 to-cyan-400 bg-clip-text text-transparent italic tracking-tighter">BD-MARKETING.COM</h1>
                <p class="text-[9px] text-slate-500 font-bold uppercase tracking-[3px] mt-1">Trust & Quality Since 2025</p>
            </div>
            <div onclick="location.href='profile.html'" class="h-11 w-11 glass rounded-2xl flex items-center justify-center text-blue-400 border border-blue-500/20 active:scale-90 transition">
                <i class="fas fa-user-shield text-xl"></i>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-8">
            <div class="bg-gradient-to-br from-blue-600 to-blue-800 p-5 rounded-3xl shadow-xl relative overflow-hidden">
                <p class="text-[10px] text-blue-100 font-bold opacity-70 italic">মেইন ব্যালেন্স</p>
                <h2 class="text-2xl font-black mt-1">৳ <span id="mainBalance">0.00</span></h2>
                <i class="fas fa-coins absolute -right-2 -bottom-2 text-4xl text-white opacity-10"></i>
            </div>
            <div class="glass p-5 rounded-3xl relative overflow-hidden">
                <p class="text-[10px] text-slate-400 font-bold opacity-70 italic">পেন্ডিং ব্যালেন্স</p>
                <h2 class="text-2xl font-black mt-1 text-orange-400">৳ <span id="pendingBalance">0.00</span></h2>
                <i class="fas fa-clock-rotate-left absolute -right-2 -bottom-2 text-4xl text-white opacity-5"></i>
            </div>
        </div>
    </header>

    <div class="px-6 grid grid-cols-4 gap-3 mt-6">
        <div onclick="location.href='withdraw.html'" class="glass p-3 rounded-2xl flex flex-col items-center gap-1 active:scale-90 transition">
            <i class="fas fa-wallet text-green-400"></i>
            <span class="text-[9px] font-bold">উইথড্র</span>
        </div>
        <div onclick="location.href='history.html'" class="glass p-3 rounded-2xl flex flex-col items-center gap-1 active:scale-90 transition">
            <i class="fas fa-list-check text-blue-400"></i>
            <span class="text-[9px] font-bold">হিস্ট্রি</span>
        </div>
        <div onclick="location.href='notice.html'" class="glass p-3 rounded-2xl flex flex-col items-center gap-1 active:scale-90 transition">
            <i class="fas fa-bullhorn text-orange-400"></i>
            <span class="text-[9px] font-bold">নোটিশ</span>
        </div>
        <div onclick="location.href='help.html'" class="glass p-3 rounded-2xl flex flex-col items-center gap-1 active:scale-90 transition">
            <i class="fas fa-headset text-red-400"></i>
            <span class="text-[9px] font-bold">হেল্প</span>
        </div>
    </div>

    <main class="px-6 mt-10">
        <div class="flex items-center justify-between mb-5">
            <h3 class="text-lg font-bold flex items-center gap-2">
                <i class="fas fa-bolt text-yellow-400 text-sm"></i> এভেলেবেল কাজসমূহ
            </h3>
            <span class="text-[10px] text-blue-400 font-bold bg-blue-500/10 px-2 py-1 rounded">LIVE FEED</span>
        </div>

        <div id="taskList" class="space-y-4">
            <div class="py-10 text-center opacity-50">
                <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                <p class="text-xs">সার্ভার থেকে কাজ লোড হচ্ছে...</p>
            </div>
        </div>
    </main>

    <div class="fixed bottom-0 left-0 right-0 p-4 z-50">
        <div class="glass max-w-md mx-auto rounded-[30px] px-10 py-4 flex justify-between items-center shadow-2xl border border-white/10">
            <button onclick="location.href='buyer_home.html'" class="nav-active flex flex-col items-center gap-1">
                <i class="fas fa-house-chimney text-xl"></i>
                <span class="text-[8px] font-black uppercase tracking-tighter">Home</span>
            </button>
            <button onclick="location.href='profile.html'" class="text-slate-500 flex flex-col items-center gap-1">
                <i class="fas fa-user text-xl"></i>
                <span class="text-[8px] font-black uppercase tracking-tighter">Profile</span>
            </button>
            <button id="logoutBtn" class="text-red-500/70 flex flex-col items-center gap-1">
                <i class="fas fa-power-off text-xl"></i>
                <span class="text-[8px] font-black uppercase tracking-tighter">Exit</span>
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration (Saddam's Project)
        const firebaseConfig = {
            apiKey: "AIzaSyDRwrekZBZ31ACszDk2EJM_IqxRRwaGfCg",
            authDomain: "bd-marketing-55a81.firebaseapp.com",
            projectId: "bd-marketing-55a81",
            appId: "1:678696512628:web:edfc22a62f55dad41df521"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ১০% পার্মানেন্ট কমিশন লজিক (আপনি চাইলে এখান থেকে ১০ পরিবর্তন করতে পারেন)
        const ADMIN_COMMISSION = 10; 

        onAuthStateChanged(auth, (user) => {
            if (user) {
                // ১. ইউজারের ব্যালেন্স ট্র্যাক করা
                onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        document.getElementById('mainBalance').innerText = (data.balance || 0).toFixed(2);
                        document.getElementById('pendingBalance').innerText = (data.pending_balance || 0).toFixed(2);
                    }
                });

                // ২. লাইভ জব লোড করা
                const jobsQuery = query(collection(db, "jobs"), where("status", "==", "active"));
                onSnapshot(jobsQuery, (snapshot) => {
                    const taskList = document.getElementById('taskList');
                    taskList.innerHTML = "";

                    if (snapshot.empty) {
                        taskList.innerHTML = `<div class="p-10 text-center glass rounded-3xl opacity-40">
                            <i class="fas fa-folder-open text-3xl mb-2"></i>
                            <p class="text-xs font-bold">বর্তমানে কোনো কাজ নেই</p>
                        </div>`;
                        return;
                    }

                    snapshot.forEach((jobDoc) => {
                        const job = jobDoc.data();
                        
                        // ১০% কমিশন কাটার পর বায়ার যা দেখবে
                        const displayPrice = job.original_price - (job.original_price * ADMIN_COMMISSION / 100);

                        taskList.innerHTML += `
                            <div onclick="location.href='task_details.html?id=${jobDoc.id}'" class="glass p-5 rounded-[25px] flex items-center justify-between border-l-4 border-l-blue-500 active:scale-[0.98] transition">
                                <div class="flex items-center gap-4">
                                    <div class="h-10 w-10 bg-blue-500/10 rounded-xl flex items-center justify-center text-blue-400">
                                        <i class="fas fa-tasks text-lg"></i>
                                    </div>
                                    <div>
                                        <h4 class="text-sm font-bold text-slate-200">${job.title}</h4>
                                        <p class="text-[10px] text-green-500 font-bold">Reward: ৳ ${displayPrice.toFixed(2)}</p>
                                    </div>
                                </div>
                                <i class="fas fa-chevron-right text-slate-700 text-xs"></i>
                            </div>`;
                    });
                });
            } else {
                window.location.href = "index.html";
            }
        });

        // Logout Function
        document.getElementById('logoutBtn').onclick = () => {
            if(confirm("আপনি কি লগআউট করতে চান?")) {
                signOut(auth).then(() => { window.location.href = "index.html"; });
            }
        };
    </script>
</body>
  </html>
