<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BD-MARKETING | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #050810; color: #f8fafc; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sidebar { position: fixed; left: -280px; top: 0; width: 280px; height: 100%; background: #0b0f1a; transition: 0.4s ease; z-index: 1000; border-right: 1px solid rgba(59, 130, 246, 0.1); }
        .sidebar.active { left: 0; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 999; }
        .overlay.active { display: block; }
        /* স্মুথ স্ক্রলিং এর জন্য */
        #taskList { will-change: transform; transition: all 0.3s ease; }
    </style>
</head>
<body class="pb-32">

    <div id="overlay" class="overlay"></div>
    
    <div id="sidebar" class="sidebar shadow-2xl">
        <div class="p-8 border-b border-white/5 bg-slate-900/30">
            <h1 class="text-xl font-black text-blue-500 italic uppercase">BD-MARKETING</h1>
            <p class="text-[9px] text-slate-500 font-bold mt-1 uppercase tracking-widest italic">Owner: Saddam</p>
        </div>
        <div class="py-6 flex flex-col gap-1">
            <div onclick="location.href='profile.html'" class="flex items-center gap-4 px-6 py-4 text-slate-400 hover:text-blue-400 cursor-pointer transition">
                <i class="fas fa-user-circle text-lg"></i> <span class="font-bold text-sm">প্রোফাইল</span>
            </div>
            <div onclick="location.href='history.html'" class="flex items-center gap-4 px-6 py-4 text-slate-400 hover:text-blue-400 cursor-pointer transition">
                <i class="fas fa-history text-lg"></i> <span class="font-bold text-sm">কাজের হিস্ট্রি</span>
            </div>
            <div onclick="location.href='notice.html'" class="flex items-center gap-4 px-6 py-4 text-slate-400 hover:text-blue-400 cursor-pointer transition">
                <i class="fas fa-bullhorn text-lg"></i> <span class="font-bold text-sm">নোটিশ বোর্ড</span>
            </div>
            <div onclick="location.href='help.html'" class="flex items-center gap-4 px-6 py-4 text-slate-400 hover:text-blue-400 cursor-pointer transition">
                <i class="fas fa-headset text-lg"></i> <span class="font-bold text-sm">সাপোর্ট সেন্টার</span>
            </div>
            <div class="mt-4 pt-4 border-t border-white/5">
                <div onclick="logoutAction()" class="flex items-center gap-4 px-6 py-4 text-red-500 cursor-pointer transition">
                    <i class="fas fa-power-off text-lg"></i> <span class="font-bold text-sm">লগআউট</span>
                </div>
            </div>
        </div>
    </div>

    <header class="p-6 pt-10">
        <div class="flex items-start justify-between mb-4">
            <button id="menuBtn" class="h-10 w-10 glass rounded-xl flex items-center justify-center text-blue-500 shadow-lg active:scale-90 transition">
                <i class="fas fa-bars-staggered text-lg"></i>
            </button>
        </div>
        <div class="text-left -mt-2">
            <h1 class="text-4xl font-black italic text-white tracking-tighter leading-none">BD-MARKETING<span class="text-blue-500 text-2xl">.COM</span></h1>
            <p class="text-[11px] font-bold text-blue-400 uppercase tracking-[0.2em] mt-2 italic">Admin: Saddam</p>
        </div>

        <div class="grid grid-cols-2 gap-3 mt-8 mb-4">
            <div class="glass p-4 rounded-3xl border-l-4 border-blue-500 shadow-xl">
                <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest mb-1">Main Balance</p>
                <h2 class="text-xl font-black text-white italic">৳ <span id="mainBalance">0.00</span></h2>
            </div>
            <div class="glass p-4 rounded-3xl border-l-4 border-orange-500 shadow-xl">
                <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest mb-1">Pending</p>
                <h2 class="text-xl font-black text-white italic">৳ <span id="pendingBalance">0.00</span></h2>
            </div>
        </div>

        <div class="glass py-2 px-4 rounded-xl flex items-center gap-3 bg-red-500/5 border-red-500/10">
            <i class="fas fa-bolt text-[10px] text-red-500 animate-pulse"></i>
            <marquee id="scrollingNotice" class="text-[10px] font-bold text-slate-400" scrollamount="3">লোড হচ্ছে...</marquee>
        </div>
    </header>

    <main class="px-6">
        <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4">Available Tasks</h3>
        <div id="taskList" class="space-y-3 pb-10">
            </div>
    </main>

    <div class="fixed bottom-0 left-0 right-0 p-6 z-50">
        <div class="glass max-w-[260px] mx-auto rounded-full px-2 py-2 flex justify-between items-center bg-slate-900/95 border border-white/10 shadow-2xl">
            <button onclick="location.href='buyer_home.html'" class="flex-1 flex flex-col items-center gap-1 text-blue-500">
                <i class="fas fa-house text-base"></i>
                <span class="text-[8px] font-black uppercase">Home</span>
            </button>
            <div class="h-5 w-[1px] bg-white/10"></div>
            <button onclick="location.href='withdraw.html'" class="flex-1 flex flex-col items-center gap-1 text-slate-500">
                <i class="fas fa-wallet text-base"></i>
                <span class="text-[8px] font-black uppercase">Withdraw</span>
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDRwrekZBZ31ACszDk2EJM_IqxRRwaGfCg",
            authDomain: "bd-marketing-55a81.firebaseapp.com",
            projectId: "bd-marketing-55a81",
            appId: "1:678696512628:web:edfc22a62f55dad41df521"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        menuBtn.onclick = () => { sidebar.classList.add('active'); overlay.classList.add('active'); }
        overlay.onclick = () => { sidebar.classList.remove('active'); overlay.classList.remove('active'); }

        onAuthStateChanged(auth, (user) => {
            if (user) { initDashboard(user); } else { window.location.replace("index.html"); }
        });

        async function initDashboard(user) {
            // ১. ইউজারের করা কাজের লিস্ট সংগ্রহ (যাতে ডুপ্লিকেট না আসে)
            const completedJobs = [];
            const qSubmit = query(collection(db, "submissions"), where("userId", "==", user.uid));
            const subSnap = await getDocs(qSubmit);
            subSnap.forEach(d => completedJobs.push(d.data().jobId));

            // ২. নোটিশ ও ব্যালেন্স লোড
            onSnapshot(doc(db, "settings", "emergency_notice"), (s) => {
                if(s.exists()) document.getElementById('scrollingNotice').innerText = s.data().text;
            });

            onSnapshot(doc(db, "users", user.uid), (s) => {
                if(s.exists()) {
                    document.getElementById('mainBalance').innerText = (s.data().balance || 0).toFixed(2);
                    document.getElementById('pendingBalance').innerText = (s.data().pending_balance || 0).toFixed(2);
                }
            });

            // ৩. অপ্টিমাইজড জব লিস্ট (হাজার হাজার কাজ থাকলেও হ্যাং করবে না)
            const qJobs = query(collection(db, "jobs"), where("status", "==", "active"));
            onSnapshot(qJobs, (sn) => {
                const list = document.getElementById('taskList');
                let html = "";
                sn.forEach((d) => {
                    const job = d.data();
                    // যদি ইউজার আগে কাজটা করে থাকে, তবে দেখাবে না
                    if (!completedJobs.includes(d.id)) {
                        const reward = job.original_price - (job.original_price * 0.10);
                        let icon = "fa-briefcase text-blue-500";
                        const t = job.title.toLowerCase();
                        if(t.includes("youtube")) icon = "fa-youtube text-red-500";
                        else if(t.includes("facebook")) icon = "fa-facebook text-blue-600";
                        else if(t.includes("tiktok")) icon = "fa-tiktok text-pink-500";

                        html += `
                        <div onclick="location.href='task_details.html?id=${d.id}'" class="glass p-4 rounded-[25px] flex items-center justify-between border-l-4 border-l-blue-500 transition active:scale-95">
                            <div class="flex items-center gap-4">
                                <div class="h-10 w-10 bg-white/5 rounded-xl flex items-center justify-center text-lg"><i class="fab ${icon}"></i></div>
                                <div>
                                    <h4 class="text-xs font-bold text-slate-200">${job.title}</h4>
                                    <p class="text-[10px] text-green-500 font-black">৳ ${reward.toFixed(2)}</p>
                                </div>
                            </div>
                            <i class="fas fa-chevron-right text-[10px] text-slate-700"></i>
                        </div>`;
                    }
                });
                list.innerHTML = html || "<p class='text-center text-[10px] opacity-30 mt-10'>নতুন কোনো কাজ নেই</p>";
            });
        }

        window.logoutAction = function() { if(confirm("লগআউট করবেন?")) signOut(auth).then(() => location.replace("index.html")); }
    </script>
</body>
  </html>
