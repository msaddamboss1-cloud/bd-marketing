<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saddam Premium Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #020617; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .bottom-nav { background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(20px); border-top: 1px solid rgba(59, 130, 246, 0.2); }
        .active-dot { width: 4px; height: 4px; background: #3b82f6; border-radius: 50%; box-shadow: 0 0 8px #3b82f6; margin-top: 2px; }
        ::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body class="pb-24">

    <header class="p-5 pt-8 bg-slate-900/80 rounded-b-[40px] border-b border-blue-500/10 shadow-xl">
        <div class="flex justify-between items-start">
            <div>
                <h1 class="text-xl font-black bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent italic tracking-tighter">BD-MARKETING</h1>
                <div class="flex items-center gap-1.5 mt-1 bg-slate-800/40 w-fit px-2 py-0.5 rounded-full border border-blue-500/10">
                    <p class="text-[9px] text-blue-400 font-bold uppercase tracking-widest">Admin: Saddam</p>
                    <i class="fas fa-check-circle text-[8px] text-blue-500"></i>
                </div>
            </div>
            <div onclick="location.href='profile.html'" class="h-10 w-10 glass rounded-xl flex items-center justify-center text-blue-400 active:scale-90 transition">
                <i class="fas fa-user-shield text-lg"></i>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mt-6">
            <div class="bg-gradient-to-br from-blue-600 to-indigo-800 p-4 rounded-2xl shadow-lg relative overflow-hidden">
                <p class="text-[9px] text-blue-100 font-bold opacity-60 uppercase">Main Balance</p>
                <h2 class="text-xl font-black mt-0.5 tracking-tight">৳ <span id="mainBalance">0.00</span></h2>
                <i class="fas fa-wallet absolute -right-2 -bottom-2 text-3xl text-white/10"></i>
            </div>
            <div class="glass p-4 rounded-2xl relative overflow-hidden">
                <p class="text-[9px] text-slate-400 font-bold opacity-60 uppercase">Pending</p>
                <h2 class="text-xl font-black mt-0.5 text-orange-400 tracking-tight">৳ <span id="pendingBalance">0.00</span></h2>
                <i class="fas fa-clock-rotate-left absolute -right-2 -bottom-2 text-3xl text-white/5"></i>
            </div>
        </div>
    </header>

    <main class="px-5 mt-6">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-sm font-bold flex items-center gap-2">
                <span class="h-1.5 w-1.5 rounded-full bg-blue-500 animate-pulse"></span>
                লাইভ কাজসমূহ
            </h3>
            <p class="text-[9px] text-slate-500 font-bold uppercase">Auto Update</p>
        </div>

        <div id="taskList" class="space-y-3">
            <div class="py-16 text-center opacity-40">
                <i class="fas fa-circle-notch fa-spin text-xl text-blue-500 mb-2"></i>
                <p class="text-[10px] font-bold">সার্ভার চেক করা হচ্ছে...</p>
            </div>
        </div>
    </main>

    <div class="fixed bottom-0 left-0 right-0 p-4 z-50">
        <div class="bottom-nav max-w-md mx-auto rounded-3xl px-6 py-3 flex justify-around items-center shadow-2xl">
            
            <button onclick="location.href='buyer_home.html'" class="flex flex-col items-center gap-0.5 text-blue-500">
                <i class="fas fa-home text-lg"></i>
                <span class="text-[8px] font-bold uppercase">Home</span>
                <div class="active-dot"></div>
            </button>

            <button onclick="location.href='withdraw.html'" class="flex flex-col items-center gap-0.5 text-slate-500">
                <i class="fas fa-money-bill-transfer text-lg"></i>
                <span class="text-[8px] font-bold uppercase">Withdraw</span>
            </button>

            <button onclick="location.href='history.html'" class="flex flex-col items-center gap-0.5 text-slate-500">
                <i class="fas fa-history text-lg"></i>
                <span class="text-[8px] font-bold uppercase">History</span>
            </button>

            <button onclick="location.href='notice.html'" class="flex flex-col items-center gap-0.5 text-slate-500">
                <i class="fas fa-bullhorn text-lg"></i>
                <span class="text-[8px] font-bold uppercase">Notice</span>
            </button>

            <button id="logoutBtn" class="flex flex-col items-center gap-0.5 text-red-500/50">
                <i class="fas fa-power-off text-lg"></i>
                <span class="text-[8px] font-bold uppercase">Exit</span>
            </button>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDRwrekZBZ31ACszDk2EJM_IqxRRwaGfCg",
            authDomain: "bd-marketing-55a81.firebaseapp.com",
            projectId: "bd-marketing-55a81",
            appId: "1:678696512628:web:edfc22a62f55dad41df521"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ১০% ফিক্সড কমিশন
        const COMMISSION = 10; 

        onAuthStateChanged(auth, (user) => {
            if (user) {
                // ব্যালেন্স লোড
                onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        const d = docSnap.data();
                        document.getElementById('mainBalance').innerText = (d.balance || 0).toFixed(2);
                        document.getElementById('pendingBalance').innerText = (d.pending_balance || 0).toFixed(2);
                    }
                });

                // লাইভ কাজ লোড
                const q = query(collection(db, "jobs"), where("status", "==", "active"));
                onSnapshot(q, (snap) => {
                    const list = document.getElementById('taskList');
                    list.innerHTML = "";
                    if (snap.empty) {
                        list.innerHTML = `<div class='p-8 text-center glass rounded-2xl opacity-40 text-[10px] font-bold italic'><i class='fas fa-info-circle mb-2 text-lg'></i><br>বর্তমানে কোনো কাজ নেই</div>`;
                        return;
                    }
                    snap.forEach((jDoc) => {
                        const job = jDoc.data();
                        const bPrice = job.original_price - (job.original_price * COMMISSION / 100);
                        list.innerHTML += `
                            <div onclick="location.href='task_details.html?id=${jDoc.id}'" class="glass p-4 rounded-2xl flex items-center justify-between border-l-2 border-l-blue-500 active:bg-slate-800 transition shadow-md">
                                <div class="flex items-center gap-3">
                                    <div class="h-9 w-9 bg-blue-500/10 rounded-xl flex items-center justify-center text-blue-400">
                                        <i class="fas fa-check text-sm"></i>
                                    </div>
                                    <div>
                                        <h4 class="text-[13px] font-bold text-slate-200">${job.title}</h4>
                                        <p class="text-[10px] text-green-500 font-bold">প্রাপ্য: ৳ ${bPrice.toFixed(2)}</p>
                                    </div>
                                </div>
                                <i class="fas fa-chevron-right text-[10px] text-slate-700"></i>
                            </div>`;
                    });
                });
            } else { window.location.href = "index.html"; }
        });

        document.getElementById('logoutBtn').onclick = () => {
            if(confirm("Exit?")) signOut(auth).then(() => location.href = "index.html");
        };
    </script>
</body>
</html>
