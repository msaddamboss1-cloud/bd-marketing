<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saddam Premium | BD Marketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #0b0f1a; color: #f8fafc; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .sidebar { position: fixed; left: -280px; top: 0; width: 280px; height: 100%; background: #0f172a; transition: 0.4s ease; z-index: 1000; border-right: 1px solid rgba(59, 130, 246, 0.2); }
        .sidebar.active { left: 0; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 999; }
        .overlay.active { display: block; }
        .nav-item { display: flex; align-items: center; gap: 15px; padding: 12px 20px; border-radius: 12px; margin: 5px 15px; transition: 0.3s; cursor: pointer; }
        .nav-item:hover { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
        .bottom-nav { background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(20px); border-top: 1px solid rgba(59, 130, 246, 0.2); }
        ::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body class="pb-28">

    <div id="overlay" class="overlay"></div>
    <div id="sidebar" class="sidebar">
        <div class="p-8 border-b border-white/5">
            <h1 class="text-xl font-black text-blue-500 italic">BD-MARKETING</h1>
            <p class="text-[9px] text-slate-500 font-bold mt-1 uppercase">User Control Panel</p>
        </div>
        <div class="flex flex-col gap-1 mt-4">
            <div onclick="location.href='profile.html'" class="nav-item"><i class="fas fa-user-circle"></i> প্রোফাইল</div>
            <div onclick="location.href='wallet.html'" class="nav-item"><i class="fas fa-wallet"></i> ওয়ালেট</div>
            <div onclick="location.href='history.html'" class="nav-item"><i class="fas fa-history"></i> কাজের হিস্ট্রি</div>
            <div onclick="location.href='notice.html'" class="nav-item"><i class="fas fa-bullhorn"></i> নোটিশ বোর্ড</div>
            <div onclick="location.href='help.html'" class="nav-item"><i class="fas fa-headset"></i> সাপোর্ট সেন্টার</div>
            <div class="mt-8 border-t border-white/5 pt-4">
                <button id="sidebarLogout" class="nav-item text-red-400 w-full"><i class="fas fa-power-off"></i> লগআউট</button>
            </div>
        </div>
    </div>

    <header class="p-5 pt-10 bg-slate-900/60 rounded-b-[40px] border-b border-blue-500/10 shadow-2xl">
        <div class="flex justify-between items-center">
            <button id="menuBtn" class="h-10 w-10 glass rounded-xl flex items-center justify-center text-blue-400 active:scale-90 transition">
                <i class="fas fa-bars-staggered"></i>
            </button>
            <div class="text-center">
                <h1 class="text-lg font-black bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent italic">BD-MARKETING</h1>
                <div class="flex items-center gap-1 justify-center">
                    <span class="text-[9px] text-slate-500 font-bold uppercase tracking-widest">Admin: Saddam</span>
                    <i class="fas fa-check-circle text-[8px] text-blue-500"></i>
                </div>
            </div>
            <div onclick="location.href='profile.html'" class="h-10 w-10 glass rounded-xl flex items-center justify-center text-blue-400 active:scale-90 transition">
                <i class="fas fa-user-shield"></i>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3 mt-8">
            <div class="bg-gradient-to-br from-blue-600 to-indigo-800 p-4 rounded-2xl shadow-lg relative overflow-hidden">
                <p class="text-[9px] text-blue-100 font-bold opacity-60 uppercase">Main Balance</p>
                <h2 class="text-xl font-black mt-0.5 tracking-tight">৳ <span id="mainBalance">0.00</span></h2>
                <i class="fas fa-wallet absolute -right-2 -bottom-2 text-3xl text-white/10"></i>
            </div>
            <div class="glass p-4 rounded-2xl relative overflow-hidden border-orange-500/10">
                <p class="text-[9px] text-slate-400 font-bold opacity-60 uppercase">Pending</p>
                <h2 class="text-xl font-black mt-0.5 text-orange-400 tracking-tight">৳ <span id="pendingBalance">0.00</span></h2>
                <i class="fas fa-clock-rotate-left absolute -right-2 -bottom-2 text-3xl text-white/5"></i>
            </div>
        </div>
    </header>

    <main class="px-5 mt-8">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-sm font-bold flex items-center gap-2">
                <span class="h-1.5 w-1.5 rounded-full bg-blue-500 animate-pulse"></span>
                লাইভ কাজসমূহ
            </h3>
            <p class="text-[9px] text-slate-500 font-bold">AUTO UPDATE</p>
        </div>
        <div id="taskList" class="space-y-3">
            <div class="py-16 text-center glass rounded-[30px] opacity-40">
                <i class="fas fa-spinner fa-spin text-xl text-blue-500 mb-2"></i>
                <p class="text-[11px] font-bold tracking-tight">সার্ভার চেক করা হচ্ছে...</p>
            </div>
        </div>
    </main>

    <div class="fixed bottom-0 left-0 right-0 p-4 z-50">
        <div class="bottom-nav max-w-md mx-auto rounded-[30px] px-8 py-3 flex justify-around items-center shadow-2xl">
            <button onclick="location.href='buyer_home.html'" class="flex flex-col items-center gap-0.5 text-blue-500">
                <i class="fas fa-house-user text-xl"></i>
                <span class="text-[8px] font-bold">HOME</span>
            </button>
            <button onclick="location.href='withdraw.html'" class="flex flex-col items-center gap-0.5 text-slate-500 hover:text-blue-400 transition">
                <i class="fas fa-money-bill-transfer text-xl"></i> <span class="text-[8px] font-bold uppercase">Withdraw</span>
            </button>
            <button onclick="location.href='history.html'" class="flex flex-col items-center gap-0.5 text-slate-500 hover:text-blue-400 transition">
                <i class="fas fa-file-lines text-xl"></i>
                <span class="text-[8px] font-bold uppercase tracking-tighter">History</span>
            </button>
            <button id="logoutBtn" class="flex flex-col items-center gap-0.5 text-red-500/60">
                <i class="fas fa-power-off text-xl"></i>
                <span class="text-[8px] font-bold uppercase tracking-tighter">Exit</span>
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDRwrekZBZ31ACszDk2EJM_IqxRRwaGfCg",
            authDomain: "bd-marketing-55a81.firebaseapp.com",
            projectId: "bd-marketing-55a81",
            appId: "1:678696512628:web:edfc22a62f55dad41df521"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // লগইন ডাটা ব্রাউজারে সেভ রাখার লজিক
        setPersistence(auth, browserLocalPersistence);

        // Sidebar Control
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        menuBtn.onclick = () => { sidebar.classList.add('active'); overlay.classList.add('active'); }
        overlay.onclick = () => { sidebar.classList.remove('active'); overlay.classList.remove('active'); }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onSnapshot(doc(db, "users", user.uid), (ds) => {
                    if (ds.exists()) {
                        document.getElementById('mainBalance').innerText = (ds.data().balance || 0).toFixed(2);
                        document.getElementById('pendingBalance').innerText = (ds.data().pending_balance || 0).toFixed(2);
                    }
                });

                // Live Jobs Feed
                const q = query(collection(db, "jobs"), where("status", "==", "active"));
                onSnapshot(q, (sn) => {
                    const list = document.getElementById('taskList');
                    list.innerHTML = "";
                    if (sn.empty) {
                        list.innerHTML = `<div class='py-12 text-center glass rounded-3xl opacity-50'><i class='fas fa-box-open text-2xl mb-2'></i><p class='text-[10px] font-bold uppercase'>বর্তমানে কোনো কাজ নেই</p></div>`;
                        return;
                    }
                    sn.forEach((d) => {
                        const j = d.data();
                        const p = j.original_price - (j.original_price * 10 / 100);
                        list.innerHTML += `
                            <div onclick="location.href='task_details.html?id=${d.id}'" class="glass p-4 rounded-[25px] flex items-center justify-between border-l-2 border-l-blue-500 active:scale-95 transition shadow-lg">
                                <div class="flex items-center gap-3">
                                    <div class="h-9 w-9 bg-blue-500/10 rounded-xl flex items-center justify-center text-blue-400"><i class="fas fa-check"></i></div>
                                    <div><h4 class="text-[13px] font-bold text-slate-100">${j.title}</h4><p class="text-[10px] text-green-500 font-bold tracking-tight">Reward: ৳ ${p.toFixed(2)}</p></div>
                                </div>
                                <i class="fas fa-chevron-right text-[10px] text-slate-700"></i>
                            </div>`;
                    });
                });
            } else {
                // ইউজার লগইন না থাকলে ইনডেক্সে পাঠাবে
                window.location.href = "index.html";
            }
        });

        const handleLogout = () => {
            if(confirm("লগআউট করতে চান?")) signOut(auth).then(() => location.href="index.html");
        };
        document.getElementById('logoutBtn').onclick = handleLogout;
        document.getElementById('sidebarLogout').onclick = handleLogout;
    </script>
</body>
</html>
