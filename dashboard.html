<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDRwrekZBZ31ACszDk2EJM_IqxRRwaGfCg",
        authDomain: "bd-marketing-55a81.firebaseapp.com",
        projectId: "bd-marketing-55a81",
        storageBucket: "bd-marketing-55a81.firebasestorage.app",
        messagingSenderId: "678696512628",
        appId: "1:678696512628:web:edfc22a62f55dad41df521"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            console.log("ইউজার পাওয়া গেছে:", user.uid);
            try {
                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const userData = docSnap.data();
                    if (userData.role === 'buyer') {
                        window.location.replace('buyer-home.html');
                    } else {
                        window.location.replace('seller-home.html');
                    }
                } else {
                    console.log("ডাটাবেসে ইউজারের তথ্য নেই!");
                    // যদি ডাটাবেসে তথ্য না থাকে তবেই ফেরত পাঠাবে
                    // window.location.replace('index.html'); 
                }
            } catch (e) {
                console.error("এরর:", e);
            }
        } else {
            // লগইন করা না থাকলে ইনডেক্সে পাঠাবে
            window.location.replace('index.html');
        }
    });
</script>
