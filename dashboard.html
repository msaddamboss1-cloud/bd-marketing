<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting... - BD Marketing</title>
    <style>
        body { background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #38bdf8; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <div class="loader" style="margin: 0 auto 15px;"></div>
        <p>অপেক্ষা করুন, আপনাকে ড্যাশবোর্ডে নিয়ে যাওয়া হচ্ছে...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        // আপনার আসল কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyDRwrekZBZ31ACszDk2EJM_IqxRRwaGfCg",
            authDomain: "bd-marketing-55a81.firebaseapp.com",
            projectId: "bd-marketing-55a81",
            storageBucket: "bd-marketing-55a81.firebasestorage.app",
            messagingSenderId: "678696512628",
            appId: "1:678696512628:web:edfc22a62f55dad41df521"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ইউজার লগইন অবস্থায় আছে কি না চেক করা
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    // ডাটাবেস থেকে ইউজারের রোল (Role) খুঁজে বের করা
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    
                    if (userDoc.exists()) {
                        const role = userDoc.data().role;
                        
                        // রোল অনুযায়ী রিডাইরেক্ট
                        if (role === 'buyer') {
                            window.location.href = 'buyer-home.html';
                        } else if (role === 'seller') {
                            window.location.href = 'seller-home.html';
                        } else {
                            alert("ইউজার রোল খুঁজে পাওয়া যায়নি!");
                            window.location.href = 'index.html';
                        }
                    } else {
                        alert("ইউজার প্রোফাইল ডাটাবেসে নেই!");
                        window.location.href = 'index.html';
                    }
                } catch (error) {
                    console.error("Error:", error);
                    window.location.href = 'index.html';
                }
            } else {
                // লগইন করা না থাকলে লগইন পেজে পাঠিয়ে দাও
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
