<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin - BD Marketing</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 10px; text-align: left; border-left: 5px solid #38bdf8; }
        .tab-btn { padding: 10px; cursor: pointer; background: #1e293b; color: white; border: none; border-radius: 5px; margin-right: 5px; }
        .tab-active { background: #38bdf8; color: black; }
    </style>
</head>
<body>
    <div class="glass-card" style="width: 95%; max-width: 800px;">
        <h2>মাস্টার কন্ট্রোল প্যানেল</h2>
        <div style="margin-bottom: 20px;">
            <button onclick="showSection('dep')" class="tab-btn tab-active" id="btn-dep">ডিপোজিট</button>
            <button onclick="showSection('with')" class="tab-btn" id="btn-with">উইথড্র</button>
        </div>

        <div id="dep-section">
            <h4>পেন্ডিং ডিপোজিট</h4>
            <div id="depList">লোড হচ্ছে...</div>
        </div>

        <div id="with-section" style="display:none;">
            <h4>পেন্ডিং উইথড্র</h4>
            <div id="withList">লোড হচ্ছে...</div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { collection, query, where, getDocs, doc, updateDoc, increment, deleteDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        // শুধুমাত্র আপনার ইমেইল দিয়ে এক্সেস
        onAuthStateChanged(auth, (user) => {
            if (user && user.email === "msaddamboss1@gmail.com") { loadData(); }
            else { window.location.href = 'index.html'; }
        });

        async function loadData() {
            // ডিপোজিট লোড
            const depSnap = await getDocs(query(collection(db, "deposit_requests"), where("status", "==", "pending")));
            const depCont = document.getElementById('depList');
            depCont.innerHTML = "";
            depSnap.forEach(res => {
                const d = res.data();
                depCont.innerHTML += `<div class="admin-card">
                    <p>ইউজার: ${d.email} | পরিমাণ: ৳${d.amount} (${d.method})</p>
                    <p>TxID: ${d.txid}</p>
                    <button class="tab-btn tab-active" onclick="approveDep('${res.id}', '${d.uid}', ${d.amount})">Approve</button>
                </div>`;
            });

            // উইথড্র লোড
            const withSnap = await getDocs(query(collection(db, "withdraw_requests"), where("status", "==", "pending")));
            const withCont = document.getElementById('withList');
            withCont.innerHTML = "";
            withSnap.forEach(res => {
                const w = res.data();
                withCont.innerHTML += `<div class="admin-card" style="border-left-color: #ef4444;">
                    <p>ইউজার: ${w.email} | পরিমাণ: ৳${w.amount} (${w.method})</p>
                    <p>নম্বর: ${w.number}</p>
                    <button class="tab-btn" style="background:#ef4444;" onclick="completeWith('${res.id}')">Paid Done</button>
                </div>`;
            });
        }

        window.approveDep = async (rid, uid, amt) => {
            if(confirm("টাকা পেয়েছেন তো?")){
                await updateDoc(doc(db, "users", uid), { depositBalance: increment(amt) });
                await updateDoc(doc(db, "deposit_requests", rid), { status: "approved" });
                alert("Approve সফল!"); location.reload();
            }
        };

        window.completeWith = async (rid) => {
            if(confirm("টাকা কি পাঠিয়ে দিয়েছেন?")){
                await updateDoc(doc(db, "withdraw_requests", rid), { status: "completed" });
                alert("উইথড্র সফল!"); location.reload();
            }
        };

        window.showSection = (name) => {
            document.getElementById('dep-section').style.display = name === 'dep' ? 'block' : 'none';
            document.getElementById('with-section').style.display = name === 'with' ? 'block' : 'none';
        }
    </script>
</body>
</html>
