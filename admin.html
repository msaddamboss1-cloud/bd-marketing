<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - BD Marketing</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .request-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 10px; text-align: left; border-left: 5px solid var(--accent); }
        .btn-approve { background: #22c55e; color: white; padding: 5px 10px; border: none; border-radius: 5px; cursor: pointer; }
        .btn-reject { background: #ef4444; color: white; padding: 5px 10px; border: none; border-radius: 5px; cursor: pointer; margin-left: 5px; }
    </style>
</head>
<body>
    <div class="glass-card" style="width: 95%; max-width: 600px;">
        <h2>অ্যাডমিন ড্যাশবোর্ড</h2>
        <p id="adminName">চেক করা হচ্ছে...</p>
        <hr style="opacity: 0.2;">
        
        <h4 style="margin-top: 20px;">ডিপোজিট রিকোয়েস্টসমূহ</h4>
        <div id="depositRequests">
            <p>লোড হচ্ছে...</p>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { collection, query, where, getDocs, doc, updateDoc, increment, deleteDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        // ১. শুধুমাত্র আপনি (msaddamboss1@gmail.com) এই পেজ দেখতে পারবেন
        onAuthStateChanged(auth, (user) => {
            if (user && user.email === "msaddamboss1@gmail.com") {
                document.getElementById('adminName').innerText = "স্বাগতম, সাদ্দাম ভাই!";
                loadRequests();
            } else {
                alert("আপনার এই পেজে প্রবেশের অনুমতি নেই!");
                window.location.href = 'index.html';
            }
        });

        async function loadRequests() {
            const q = query(collection(db, "deposit_requests"), where("status", "==", "pending"));
            const querySnapshot = await getDocs(q);
            const container = document.getElementById('depositRequests');
            container.innerHTML = "";

            if (querySnapshot.empty) {
                container.innerHTML = "<p>কোনো পেন্ডিং রিকোয়েস্ট নেই।</p>";
                return;
            }

            querySnapshot.forEach((res) => {
                const data = res.data();
                const div = document.createElement('div');
                div.className = "request-card";
                div.innerHTML = `
                    <p><b>ইউজার:</b> ${data.email}</p>
                    <p><b>পরিমাণ:</b> ৳${data.amount} (${data.method})</p>
                    <p><b>TxID:</b> <span style="color:var(--accent)">${data.txid}</span></p>
                    <button class="btn-approve" onclick="approveDep('${res.id}', '${data.uid}', ${data.amount})">Approve</button>
                    <button class="btn-reject" onclick="rejectDep('${res.id}')">Reject</button>
                `;
                container.appendChild(div);
            });
        }

        // ২. অনুমোদন করার লজিক (টাকা সরাসরি ইউজারের অ্যাকাউন্টে যাবে)
        window.approveDep = async (reqId, userId, amount) => {
            if(confirm("আপনি কি টাকা পেয়েছেন? Approve করলে ইউজারের ব্যালেন্সে যোগ হবে।")){
                try {
                    await updateDoc(doc(db, "users", userId), {
                        depositBalance: increment(amount)
                    });
                    await updateDoc(doc(db, "deposit_requests", reqId), {
                        status: "approved"
                    });
                    alert("সফলভাবে অ্যাপ্রুভ হয়েছে!");
                    loadRequests();
                } catch (e) { alert("সমস্যা হয়েছে!"); }
            }
        };

        // ৩. রিজেক্ট করার লজিক
        window.rejectDep = async (reqId) => {
            if(confirm("আপনি কি নিশ্চিত যে এই TxID টি ভুয়া?")){
                try {
                    await deleteDoc(doc(db, "deposit_requests", reqId));
                    alert("রিকোয়েস্টটি বাতিল করা হয়েছে।");
                    loadRequests();
                } catch (e) { alert("সমস্যা হয়েছে!"); }
            }
        };
    </script>
</body>
</html>
