
<h4 style="margin-top: 30px;">উইথড্র রিকোয়েস্টসমূহ</h4>
<div id="withdrawRequests">
    <p>লোড হচ্ছে...</p>
</div>

<script type="module">
    // আপনার আগের loadRequests ফাংশনের নিচে এটি যোগ করুন
    async function loadWithdrawals() {
        const q = query(collection(db, "withdraw_requests"), where("status", "==", "pending"));
        const snap = await getDocs(q);
        const container = document.getElementById('withdrawRequests');
        container.innerHTML = snap.empty ? "<p>কোনো উইথড্র রিকোয়েস্ট নেই।</p>" : "";

        snap.forEach(res => {
            const data = res.data();
            container.innerHTML += `
                <div class="request-card" style="border-left-color: #ef4444;">
                    <p><b>ইউজার:</b> ${data.email}</p>
                    <p><b>পরিমাণ:</b> ৳${data.amount} (${data.method})</p>
                    <p><b>নম্বর:</b> ${data.number}</p>
                    <button class="btn-approve" onclick="completeWithdraw('${res.id}')">পেইড (Paid)</button>
                </div>
            `;
        });
    }
    loadWithdrawals(); // এটি কল করতে ভুলবেন না
</script>
