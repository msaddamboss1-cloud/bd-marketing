<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BD Marketing Admin</title>
    <style>
        :root { --primary: #1e3c72; --accent: #2ecc71; --dark-blue: #152951; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background-color: var(--primary); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
        }
        
        .login-card { 
            background: white; 
            width: 90%; 
            max-width: 380px; 
            padding: 40px 25px; 
            border-radius: 30px; 
            text-align: center; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .brand-name { 
            color: var(--dark-blue); 
            font-size: 24px; 
            font-weight: bold; 
            margin-bottom: 30px; 
            letter-spacing: 1px;
        }

        input, select { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 15px; 
            border: 1px solid #e0e0e0; 
            border-radius: 12px; 
            font-size: 15px; 
            background-color: #f9f9f9;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            background-color: #fff;
        }

        .btn-login { 
            width: 100%; 
            background: var(--dark-blue); 
            color: white; 
            border: none; 
            padding: 15px; 
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer; 
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .footer-links { 
            margin-top: 25px; 
            font-size: 14px; 
            color: #555; 
        }

        .footer-links a { 
            color: var(--primary); 
            font-weight: bold; 
            text-decoration: none; 
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-name">BD MARKETING</div>

        <form id="loginForm">
            <input type="email" id="email" placeholder="ইমেইল এড্রেস" required>
            <input type="password" id="password" placeholder="পাসওয়ার্ড" required>
            
            <select id="role" required>
                <option value="" disabled selected>আপনার রোল সিলেক্ট করুন</option>
                <option value="worker">ওয়ার্কার (আমি কাজ করবো)</option>
                <option value="buyer">বায়ার (আমি কাজ দেবো)</option>
            </select>

            <button type="submit" class="btn-login">লগইন করুন</button>
        </form>

        <div class="footer-links">
            নতুন ইউজার? <a href="register.html">রেজিস্ট্রেশন করুন</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const selectedRole = document.getElementById('role').value;
            
            // রোল অনুযায়ী পেজ রিডাইরেক্ট
            if (selectedRole === 'worker') {
                window.location.href = 'worker.html'; 
            } else if (selectedRole === 'buyer') {
                window.location.href = 'buyer.html';
            }
        });
    </script>

</body>
</html>
