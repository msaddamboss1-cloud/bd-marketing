<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Tasks - BD Marketing</title><link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-card" style="width: 95%; max-width: 600px;">
        <h3>জমা হওয়া কাজসমূহ (Review)</h3>
        <div id="submissionList"><p>লোড হচ্ছে...</p></div>
    </div>

    <script type="module">
        import { auth, db } from './config.js';
        import { collection, query, where, getDocs, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const q = query(collection(db, "submissions"), where("buyerUid", "==", user.uid), where("status", "==", "pending"));
                const snap = await getDocs(q);
                const container = document.getElementById('submissionList');
                container.innerHTML = snap.empty ? "<p>কোনো পেন্ডিং কাজ নেই।</p>" : "";

                snap.forEach(res => {
                    const data = res.data();
                    const div = document.createElement('div');
                    div.style = "background:rgba(255,255,255,0.05); padding:15px; border-radius:12px; margin-bottom:10px; text-align:left; border: 1px solid #334155;";
                    div.innerHTML = `
                        <p><b>কাজ:</b> ${data.jobTitle}</p>
                        <p><b>সেলার:</b> ${data.sellerEmail}</p>
                        <p style="background:#000; padding:10px; border-radius:5px;"><b>প্রমাণ:</b> ${data.proof}</p>
                        <button class="btn-primary" style="background:#22c55e; width:100px; padding:8px;" onclick="approveWork('${res.id}', '${data.sellerUid}', ${data.pay})">Approve</button>
                    `;
                    container.appendChild(div);
                });
            }
        });

        window.approveWork = async (subId, sellerId, pay) => {
            if(confirm("আপনি কি প্রমাণটি সঠিক পেয়েছেন?")){
                await updateDoc(doc(db, "submissions", subId), { status: "approved" });
                await updateDoc(doc(db, "users", sellerId), { balance: increment(pay) });
                alert("টাকা সেলারের ব্যালেন্সে পাঠিয়ে দেওয়া হয়েছে!");
                location.reload();
            }
        };
    </script>
</body>
</html>
