<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Dashboard | BD Marketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #0f172a; font-family: 'Inter', sans-serif; color: white; margin: 0; padding: 0; }
        
        /* হেডার ডিজাইন */
        .header-bg { 
            background: linear-gradient(to right, #1d4ed8, #2563eb, #3b82f6); 
            padding: 12px 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* ওনার ডিটেইলস বাটন স্টাইল */
        .owner-badge {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .owner-badge:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.2); }

        .balance-card { 
            background: rgba(30, 41, 59, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 1.2rem; 
            padding: 12px;
        }

        /* বেল অ্যানিমেশন */
        @keyframes ring {
            0% { transform: rotate(0); }
            10% { transform: rotate(15deg); }
            20% { transform: rotate(-15deg); }
            30% { transform: rotate(10deg); }
            40% { transform: rotate(-10deg); }
            50% { transform: rotate(0); }
            100% { transform: rotate(0); }
        }
        .bell-animation {
            animation: ring 2s infinite;
            display: inline-block;
            cursor: pointer;
            color: #fbbf24;
        }

        .help-center-float {
            position: fixed;
            bottom: 100px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 100;
        }
        .messenger-icon {
            background: #0084ff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0, 132, 255, 0.4);
            border: 2px solid white;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #0f172a;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #64748b; text-decoration: none; }
        .nav-item.active { color: #3b82f6; }
        .nav-item i { font-size: 20px; }
        .nav-item span { font-size: 9px; font-weight: bold; text-transform: uppercase; margin-top: 4px; }

        .task-item {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body class="pb-24">

    <header class="header-bg flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <i class="fas fa-rocket text-yellow-400 text-xl"></i>
            <h1 class="text-lg font-black uppercase tracking-tighter text-white">BD Marketing</h1>
        </div>
        <div class="owner-badge text-white" onclick="window.location.href='owner_details.html'">
            Owner: Saddam
        </div>
    </header>

    <main class="p-4 space-y-6">
        <div class="flex items-center gap-3">
            <div class="grid grid-cols-2 gap-3 flex-1">
                <div class="balance-card">
                    <p class="text-[8px] text-blue-400 font-black uppercase mb-1">Main Balance</p>
                    <h3 class="text-lg font-black italic text-white">৳ <span id="mainBalance">0.00</span></h3>
                </div>
                <div class="balance-card">
                    <p class="text-[8px] text-yellow-500 font-black uppercase mb-1">Pending</p>
                    <h3 class="text-lg font-black italic text-gray-400">৳ <span id="pendingBalance">0.00</span></h3>
                </div>
            </div>
            <div class="bg-slate-800 p-3 rounded-full flex items-center justify-center border border-white/5" onclick="window.location.href='notifications.html'">
                <i class="fas fa-bell text-xl bell-animation"></i>
            </div>
        </div>

        <div class="mt-4">
            <p class="text-[10px] font-black uppercase tracking-widest text-gray-500 mb-4 ml-1">Available Tasks</p>
            
            <div id="taskList">
                <div class="task-item flex justify-between items-center" onclick="window.location.href='task_details.html'">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-red-600/20 rounded-full flex items-center justify-center text-red-500">
                            <i class="fab fa-youtube"></i>
                        </div>
                        <div>
                            <h4 class="text-xs font-bold">YouTube Sub & Watch</h4>
                            <p class="text-[8px] text-gray-500">Reward: ৳ 5.00</p>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-700 text-xs"></i>
                </div>
            </div>
        </div>
    </main>

    <a href="help_chat.html" class="help-center-float">
        <div class="messenger-icon">
            <i class="fab fa-facebook-messenger text-2xl text-white"></i>
        </div>
        <span class="text-[8px] font-black text-blue-400 uppercase mt-1">Help Center</span>
    </a>

    <nav class="bottom-nav">
        <a href="worker_dashboard.html" class="nav-item active">
            <i class="fas fa-house"></i>
            <span>Home</span>
        </a>
        <a href="withdraw.html" class="nav-item">
            <i class="fas fa-wallet"></i>
            <span>Withdraw</span>
        </a>
        <a href="history.html" class="nav-item">
            <i class="fas fa-clock-rotate-left"></i>
            <span>History</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDRwrekZBZ31ACszDk2EJM_IqxRRwaGfCg",
            authDomain: "bd-marketing-55a81.firebaseapp.com",
            databaseURL: "https://bd-marketing-55a81-default-rtdb.firebaseio.com",
            projectId: "bd-marketing-55a81",
            storageBucket: "bd-marketing-55a81.firebasestorage.app",
            messagingSenderId: "678696512628",
            appId: "1:678696512628:web:edfc22a62f55dad41df521",
            measurementId: "G-3CP5DC4H44"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const userRef = ref(db, 'users/' + user.uid);
                onValue(userRef, (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        document.getElementById('mainBalance').innerText = (data.balance || 0).toFixed(2);
                        document.getElementById('pendingBalance').innerText = (data.pendingBalance || 0).toFixed(2);
                    }
                });
            } else {
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
