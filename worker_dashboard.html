<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Dashboard | BD Marketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;900&display=swap');
        
        body { 
            background-color: #0b1222; 
            font-family: 'Poppins', sans-serif; 
            color: white;
            margin: 0;
            padding-bottom: 90px;
        }

        /* হেডার: ৯০ ডিগ্রি শার্প */
        .header-bg {
            background: linear-gradient(to right, #1d4ed8, #3b82f6);
            border-radius: 0px; 
            padding: 18px 20px;
        }

        /* ওনার বাটন: সাদা বর্ডার এবং গোলাকার (Rounded) */
        .owner-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1.5px solid white; /* সাদা বর্ডার */
            padding: 6px 18px;
            border-radius: 50px; /* গোলাকার শেপ */
            font-size: 10px;
            font-weight: 800;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }
        .owner-btn:hover { background: white; color: #1d4ed8; }

        /* ব্যালেন্স কার্ড: গোলাকার ও সামঞ্জস্যপূর্ণ */
        .balance-card-small {
            background-color: #161e31;
            border-radius: 15px; 
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex: 1;
            height: 55px; /* বেল আইকনের সমান উচ্চতা */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .border-blue { border-left: 4px solid #2563eb; }
        .border-yellow { border-left: 4px solid #fbbf24; }

        /* নোটিফিকেশন বেল এনিমেশন (Ringing Effect) */
        @keyframes ring {
            0% { transform: rotate(0); }
            10% { transform: rotate(15deg); }
            20% { transform: rotate(-15deg); }
            30% { transform: rotate(10deg); }
            40% { transform: rotate(-10deg); }
            50% { transform: rotate(0); }
            100% { transform: rotate(0); }
        }

        .bell-box-large {
            background-color: #1e293b;
            width: 55px;
            height: 55px;
            border-radius: 15px; 
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .bell-box-large i {
            animation: ring 2s infinite ease-in-out;
            transform-origin: top center;
        }

        /* হেল্প সেন্টার ব্লিনকিং */
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }
        .help-center {
            position: fixed;
            bottom: 100px;
            right: 20px;
            z-index: 1000;
            text-align: center;
            animation: pulse 2s infinite;
        }
        .msg-circle {
            background-color: #0084ff;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid white;
            box-shadow: 0 5px 15px rgba(0, 132, 255, 0.4);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #0b1222;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .nav-item { color: #64748b; font-size: 9px; font-weight: bold; text-align: center; text-decoration: none; }
        .nav-active { color: #3b82f6; }
    </style>
</head>
<body>

    <header class="header-bg flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i class="fas fa-rocket text-yellow-400 text-2xl"></i>
            <h1 class="text-xl font-black uppercase tracking-tight">BD Marketing</h1>
        </div>
        <button onclick="window.location.href='owner_details.html'" class="owner-btn">
            Owner: Saddam
        </button>
    </header>

    <main class="p-5 space-y-6">
        <div class="flex gap-3 items-center">
            <div class="balance-card-small border-blue">
                <p class="text-[7px] font-black uppercase text-blue-500">Main Balance</p>
                <h2 class="text-lg font-black italic">৳ <span id="m_bal">0.00</span></h2>
            </div>
            <div class="balance-card-small border-yellow">
                <p class="text-[7px] font-black uppercase text-yellow-500">Pending</p>
                <h2 class="text-lg font-black italic text-gray-500">৳ <span id="p_bal">0.00</span></h2>
            </div>
            <div onclick="window.location.href='notification.html'" class="bell-box-large">
                <i class="fas fa-bell text-yellow-500 text-2xl"></i>
            </div>
        </div>

        <div class="mt-4">
            <div class="flex flex-col items-center justify-center py-20 rounded-[25px] border-2 border-dashed border-white/5 bg-[#161e31]/40">
                <i class="fas fa-bullhorn text-slate-700 text-3xl mb-4"></i>
                <h4 class="text-xs font-black text-gray-400 uppercase">System Update</h4>
                <p class="text-[9px] text-gray-600 uppercase mt-1">New tasks coming soon...</p>
            </div>
        </div>
    </main>

    <a href="help_center.html" class="help-center">
        <div class="msg-circle">
            <i class="fab fa-facebook-messenger text-white text-2xl"></i>
        </div>
        <span class="text-[8px] font-black text-blue-400 uppercase mt-1 block">Live Help</span>
    </a>

    <nav class="bottom-nav">
        <a href="worker_dashboard.html" class="nav-item nav-active"><i class="fas fa-house text-xl block mb-1"></i> HOME</a>
        <a href="withdraw.html" class="nav-item"><i class="fas fa-wallet text-xl block mb-1"></i> WITHDRAW</a>
        <a href="history.html" class="nav-item"><i class="fas fa-clock-rotate-left text-xl block mb-1"></i> HISTORY</a>
        <a href="profile.html" class="nav-item"><i class="fas fa-user text-xl block mb-1"></i> PROFILE</a>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // আপনার প্রাইভেট Firebase কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyDRwrekZBZ31ACszDk2EJM_IqxRRwaGfCg",
            authDomain: "bd-marketing-55a81.firebaseapp.com",
            databaseURL: "https://bd-marketing-55a81-default-rtdb.firebaseio.com",
            projectId: "bd-marketing-55a81",
            storageBucket: "bd-marketing-55a81.firebasestorage.app",
            messagingSenderId: "678696512628",
            appId: "1:678696512628:web:edfc22a62f55dad41df521"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onValue(ref(db, 'users/' + user.uid), (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        document.getElementById('m_bal').innerText = (data.balance || 0).toFixed(2);
                        document.getElementById('p_bal').innerText = (data.pendingBalance || 0).toFixed(2);
                    }
                });
            }
        });
    </script>
</body>
</html>
