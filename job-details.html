<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Details - BD Marketing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glass-card" style="width: 95%; max-width: 500px; text-align: left;">
        <h2 id="jTitle" style="color: var(--accent); margin-bottom: 5px;">...</h2>
        <p id="jPay" style="font-weight: bold; color: #22c55e; margin: 0;">পেমেন্ট: ৳0.00</p>
        
        <hr style="opacity: 0.1; margin: 15px 0;">
        
        <h4>কাজের বিবরণ:</h4>
        <p id="jDesc" style="font-size: 0.9em; opacity: 0.8; white-space: pre-line;"></p>
        
        <h4>প্রমাণ হিসেবে যা লাগবে:</h4>
        <p id="jProofReq" style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; font-size: 0.9em;"></p>

        <hr style="opacity: 0.1; margin: 15px 0;">

        <h4>আপনার প্রমাণ জমা দিন:</h4>
        <textarea id="proofText" placeholder="আপনার কাজের প্রুফ এখানে লিখুন (যেমন: ইউজারনেম বা স্ক্রিনশট লিঙ্ক)..." class="input-field" style="height: 100px;"></textarea>
        
        <button id="submitBtn" class="btn-primary">কাজ জমা দিন</button>
    </div>

    <script type="module">
        import { auth, db } from './config.js';
        import { doc, getDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

        const urlParams = new URLSearchParams(window.location.search);
        const jobId = urlParams.get('id');

        async function loadJob() {
            const snap = await getDoc(doc(db, "jobs", jobId));
            const job = snap.data();
            document.getElementById('jTitle').innerText = job.title;
            document.getElementById('jPay').innerText = "পেমেন্ট: ৳" + job.pay.toFixed(2);
            document.getElementById('jDesc').innerText = job.desc;
            document.getElementById('jProofReq').innerText = job.proofReq;
        }

        document.getElementById('submitBtn').onclick = async () => {
            const proof = document.getElementById('proofText').value;
            if(!proof) { alert("প্রমাণ বক্সে কিছু লিখুন!"); return; }

            try {
                const jobSnap = await getDoc(doc(db, "jobs", jobId));
                const jobData = jobSnap.data();

                await addDoc(collection(db, "submissions"), {
                    jobId: jobId,
                    buyerUid: jobData.buyerUid,
                    sellerUid: auth.currentUser.uid,
                    sellerEmail: auth.currentUser.email,
                    jobTitle: jobData.title,
                    pay: jobData.pay,
                    proof: proof,
                    status: "pending",
                    timestamp: serverTimestamp()
                });

                alert("কাজ জমা হয়েছে! বায়ার চেক করে টাকা দিবে।");
                window.location.href = 'seller-home.html';
            } catch (e) { alert("ত্রুটি হয়েছে!"); }
        };

        loadJob();
    </script>
</body>
</html>
