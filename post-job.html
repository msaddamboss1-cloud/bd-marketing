<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="style.css"></head>
<body>
<div class="app-container">
    <div class="glass-card">
        <h2>Post a Task</h2>
        <input id="title" placeholder="Job Title">
        <input id="reward" type="number" placeholder="Budget per worker">
        <input id="desc" placeholder="Job Description">
        <button onclick="post()">Post Job</button>
    </div>
</div>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="config.js"></script>
<script>
function post() {
    auth.onAuthStateChanged(user => {
        db.collection("tasks").add({
            title:title.value, reward:Number(reward.value), description:desc.value, buyer:user.uid, status:"open", createdAt:firebase.firestore.FieldValue.serverTimestamp()
        }).then(()=>location.href="buyer-dashboard.html");
    });
}
</script>
</body>
</html>
