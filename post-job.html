<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
    <div class="container">
        <h3>নতুন জব পোস্ট করুন</h3>
        <input type="text" id="jT" placeholder="জব টাইটেল">
        <input type="number" id="jR" placeholder="প্রতি কাজের রেট (৳)">
        <input type="number" id="jC" placeholder="কতজন মানুষ লাগবে?">
        <textarea id="jD" rows="4" placeholder="কাজের বিস্তারিত নিয়ম ও লিঙ্ক"></textarea>
        <button class="btn-primary" onclick="postJob()">জব লাইভ করুন</button>
    </div>
    <script src="config.js"></script>
    <script>
        function postJob(){
            const t=document.getElementById('jT').value, r=parseFloat(document.getElementById('jR').value), c=parseInt(document.getElementById('jC').value), d=document.getElementById('jD').value;
            if(!t || !r || !c || !d) { alert("সব ঘর পূরণ করুন!"); return; }
            const cost = r * c;
            db.collection("users").doc(auth.currentUser.uid).get().then(doc => {
                if(doc.data().balance < cost) alert("আপনার ব্যালেন্স নেই! দয়া করে ডিপোজিট করুন।");
                else {
                    db.collection("tasks").add({title:t, rate:r, count:c, desc:d, owner:auth.currentUser.uid, status:"active", date:new Date()}).then(()=>{
                        db.collection("users").doc(auth.currentUser.uid).update({balance: firebase.firestore.FieldValue.increment(-cost)});
                        alert("জব সফলভাবে পোস্ট হয়েছে!"); location.href="buyer-dashboard.html";
                    });
                }
            });
        }
    </script>
</body>
</html>
