<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Home</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="background: #0f172a; color: white;">
    <div style="display: flex; justify-content: space-between; padding: 15px; background: #1e293b;">
        <div id="menuBtn" style="font-size: 24px; cursor: pointer;"><i class="fas fa-bars"></i></div>
        <div style="font-weight: bold; color: #38bdf8;">BD Marketing (Buyer)</div>
        <div style="width: 24px;"></div>
    </div>

    <div id="sideMenu" style="position: fixed; top: 0; left: -250px; width: 250px; height: 100%; background: #1e293b; z-index: 1000; transition: 0.3s; padding: 20px;">
        <h3 style="border-bottom: 1px solid #334155; padding-bottom: 10px;">মেনু</h3>
        <a href="profile.html" style="display:block; padding: 10px 0; color: white; text-decoration: none;"><i class="fas fa-user"></i> প্রোফাইল</a>
        <a href="my-jobs.html" style="display:block; padding: 10px 0; color: white; text-decoration: none;"><i class="fas fa-tasks"></i> আমার কাজগুলো</a>
        <a href="history.html" style="display:block; padding: 10px 0; color: white; text-decoration: none;"><i class="fas fa-history"></i> ট্রানজেকশন</a>
        <button onclick="logout()" style="margin-top: 20px; background: #ef4444; border: none; color: white; padding: 8px 15px; border-radius: 5px;">লগআউট</button>
    </div>

    <div style="padding: 20px;">
        <div class="glass-card" style="margin-bottom: 20px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px;">
            <p>ডিপোজিট ব্যালেন্স: <span id="depBalance" style="color: #38bdf8; font-weight: bold;">০.০০</span> ৳</p>
        </div>

        <div class="glass-card" style="padding: 20px; border-radius: 10px; border: 1px solid #38bdf8;">
            <h4 style="margin-top: 0;">টাকা ডিপোজিট করুন</h4>
            <input type="number" id="depAmount" placeholder="টাকার পরিমাণ" class="input-field" style="width: 100%; margin-bottom: 10px;">
            <button class="btn-primary" style="width: 100%;">ডিপোজিট রিকোয়েস্ট পাঠান</button>
        </div>

        <div style="margin-top: 20px;">
            <button onclick="window.location.href='post-job.html'" style="width: 100%; padding: 15px; background: #38bdf8; color: black; border: none; font-weight: bold; border-radius: 10px;">নতুন কাজ পোস্ট করুন</button>
        </div>
    </div>

    <script type="module">
        // Firebase Config and Auth Logic (Same as before)
        const menuBtn = document.getElementById('menuBtn');
        const sideMenu = document.getElementById('sideMenu');
        let isOpen = false;
        
        menuBtn.onclick = () => {
            isOpen = !isOpen;
            sideMenu.style.left = isOpen ? "0px" : "-250px";
        };
    </script>
</body>
</html>
