<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Dashboard | BD Marketing</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #1e3c72; --accent: #2ecc71; --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f4f7f6; padding-bottom: 70px; }

        /* টপ ব্র্যান্ডিং */
        .admin-header { background: #0d1b31; color: white; padding: 10px; text-align: center; font-size: 11px; font-weight: bold; }

        .header { background: var(--primary); padding: 30px 20px; color: white; text-align: center; }
        .balance-box { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 20px; display: inline-block; min-width: 220px; border: 1px solid rgba(255,255,255,0.2); }
        .balance-box h1 { font-size: 35px; color: var(--accent); margin-top: 5px; }

        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; margin-top: -25px; }
        .stat-card { background: var(--white); padding: 20px; border-radius: 15px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .stat-card i { font-size: 22px; color: var(--primary); margin-bottom: 10px; }
        .stat-card h2 { color: var(--primary); font-size: 24px; }

        .section-title { padding: 10px 20px; font-size: 18px; font-weight: bold; color: var(--primary); }
        .no-data { text-align: center; padding: 40px; color: #aaa; font-style: italic; }

        /* Bottom Navigation */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #eee; }
        .nav-item { text-align: center; color: #999; text-decoration: none; font-size: 12px; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
        .active { color: var(--primary); }
    </style>
</head>
<body>

    <div class="admin-header">BDMARKETING.COM | OWNER: ADMIN SADDAM</div>

    <div class="header">
        <div class="balance-box">
            <p style="font-size: 14px; opacity: 0.9;">বর্তমান ব্যালেন্স</p>
            <h1>৳ <span id="balance">0.00</span></h1>
        </div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <i class="fas fa-check-circle"></i>
            <p style="font-size: 12px; color: #666;">সম্পন্ন কাজ</p>
            <h2 id="completedCount">0</h2>
        </div>
        <div class="stat-card">
            <i class="fas fa-clock"></i>
            <p style="font-size: 12px; color: #666;">পেন্ডিং কাজ</p>
            <h2 id="pendingCount">0</h2>
        </div>
    </div>

    <div class="section-title">এভেলেবল কাজ (Available Jobs)</div>
    <div class="no-data">বর্তমানে কোনো কাজ উপলব্ধ নেই।</div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active"><i class="fas fa-home"></i>হোম</a>
        <a href="#" class="nav-item"><i class="fas fa-wallet"></i>ওয়ালেট</a>
        <a href="#" class="nav-item"><i class="fas fa-history"></i>হিস্ট্রি</a>
        <a href="#" class="nav-item"><i class="fas fa-user"></i>প্রোফাইল</a>
    </nav>

</body>
</html>
