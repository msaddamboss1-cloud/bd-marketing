<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - BD Marketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-4">

    <div class="bg-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-md border border-slate-700">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-blue-500">BD Marketing</h1>
            <p class="text-[10px] text-slate-500 font-mono tracking-widest uppercase">Admin: Saddam</p>
        </div>
        
        <form id="signupForm" class="space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <input type="text" id="regName" placeholder="পুরো নাম" required class="bg-slate-700 border border-slate-600 rounded-xl py-3 px-4 focus:ring-2 focus:ring-blue-500 outline-none">
                <input type="number" id="regAge" placeholder="বয়স" required class="bg-slate-700 border border-slate-600 rounded-xl py-3 px-4 focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div class="bg-slate-700/50 p-4 rounded-2xl border border-slate-600">
                <label class="block text-[10px] font-bold mb-2 text-slate-400 uppercase">আপনি কোন একাউন্ট খুলতে চান?</label>
                <div class="flex gap-4">
                    <label class="flex-1 flex items-center justify-center gap-2 cursor-pointer p-2 bg-slate-600 rounded-lg hover:bg-blue-600 transition">
                        <input type="radio" name="role" value="buyer" checked class="accent-white"> <span class="text-sm font-bold">ক্রেতা</span>
                    </label>
                    <label class="flex-1 flex items-center justify-center gap-2 cursor-pointer p-2 bg-slate-600 rounded-lg hover:bg-blue-600 transition">
                        <input type="radio" name="role" value="seller" class="accent-white"> <span class="text-sm font-bold">বিক্রেতা</span>
                    </label>
                </div>
            </div>

            <input type="email" id="regEmail" placeholder="জিমেইল এড্রেস" required class="w-full bg-slate-700 border border-slate-600 rounded-xl py-3 px-4 focus:ring-2 focus:ring-blue-500 outline-none">
            
            <div class="relative">
                <input type="password" id="regPass" minlength="6" placeholder="পাসওয়ার্ড (৬ অক্ষর)" required class="w-full bg-slate-700 border border-slate-600 rounded-xl py-3 px-4 focus:ring-2 focus:ring-blue-500 outline-none">
                <span class="absolute inset-y-0 right-0 flex items-center pr-4 cursor-pointer text-slate-400" onclick="togglePass('regPass', this)">
                    <i class="fas fa-eye"></i>
                </span>
            </div>

            <button type="submit" id="signupBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-xl transition-all active:scale-95">
                রেজিস্ট্রেশন সম্পন্ন করুন
            </button>
        </form>
        <p class="text-center text-sm text-slate-500 mt-6">ইতিমধ্যে একাউন্ট আছে? <a href="index.html" class="text-blue-500 font-bold hover:underline">লগইন করুন</a></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDRwrekZBZ31ACszDk2EJM_IqxRRwaGfCg",
            authDomain: "bd-marketing-55a81.firebaseapp.com",
            projectId: "bd-marketing-55a81",
            storageBucket: "bd-marketing-55a81.firebasestorage.app",
            messagingSenderId: "678696512628",
            appId: "1:678696512628:web:edfc22a62f55dad41df521"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.togglePass = (id, el) => {
            const input = document.getElementById(id);
            const icon = el.querySelector('i');
            input.type = input.type === "password" ? "text" : "password";
            icon.classList.toggle('fa-eye'); icon.classList.toggle('fa-eye-slash');
        };

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('signupBtn');
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> একাউন্ট তৈরি হচ্ছে...`;
            btn.disabled = true;

            const name = document.getElementById('regName').value;
            const age = document.getElementById('regAge').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPass').value;
            const role = document.querySelector('input[name="role"]:checked').value;

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid, name: name, age: age, email: email, role: role,
                    balance: 0, deposit_list: [], withdraw_list: [], created_at: new Date()
                });

                // সরাসরি রোলে পাঠানো
                window.location.href = role === "seller" ? "seller_home.html" : "buyer_home.html";
            } catch (error) {
                alert("এরর: " + error.message);
                btn.innerText = "রেজিস্ট্রেশন সম্পন্ন করুন";
                btn.disabled = false;
            }
        });
    </script>
</body>
  </html>
