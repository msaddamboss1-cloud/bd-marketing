     <!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | BD-MARKETING</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #030508; color: #e2e8f0; }
        .owner-tag { background: linear-gradient(90deg, #3b82f6, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-input { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); transition: 0.3s; }
        .glass-input:focus { border-color: #3b82f6; background: rgba(59, 130, 246, 0.05); outline: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 py-10">

    <div class="w-full max-w-md bg-[#0a0c10] p-7 rounded-[40px] border border-white/5 shadow-2xl relative">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-black text-white italic tracking-tighter uppercase">BD-MARKETING</h1>
            <p class="text-[10px] font-black tracking-[3px] mt-1 uppercase owner-tag">Owner: Saddam</p>
        </div>

        <form id="signupForm" class="space-y-4">
            <input type="text" id="userName" placeholder="আপনার পূর্ণ নাম" class="w-full glass-input p-3.5 rounded-xl text-sm font-bold" required>
            <div class="flex gap-3">
                <input type="number" id="userAge" placeholder="বয়স" class="w-20 glass-input p-3.5 rounded-xl text-sm font-bold" required>
                <select id="userRole" class="flex-1 bg-[#11141a] border border-white/10 p-3.5 rounded-xl text-sm font-bold text-white outline-none focus:border-blue-500">
                    <option value="seller">Seller (কাজ দিতে চাই)</option>
                    <option value="buyer">Buyer (কাজ করতে চাই)</option>
                </select>
            </div>
            <input type="email" id="email" placeholder="ইমেইল (Email)" class="w-full glass-input p-3.5 rounded-xl text-sm font-bold" required>
            <div class="relative">
                <input type="password" id="password" placeholder="পাসওয়ার্ড (৪-৬ সংখ্যা)" maxlength="6" class="w-full glass-input p-3.5 rounded-xl text-sm font-bold pr-12" required>
                <button type="button" onclick="togglePass()" class="absolute right-4 top-3.5 text-slate-600"><i id="eyeIcon" class="fas fa-eye"></i></button>
            </div>
            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 p-3.5 rounded-xl text-sm font-black uppercase text-white shadow-xl">Create Account</button>
        </form>

        <div class="mt-6 flex gap-3">
            <a href="login.html" class="flex-1 bg-white/5 border border-white/10 p-3 rounded-xl text-center text-[10px] font-black text-slate-300 uppercase">Login Page</a>
            <a href="legal-notice.html" class="flex-1 bg-amber-600/20 border border-amber-600/20 p-3 rounded-xl text-center text-[10px] font-black text-amber-500 uppercase">Policy</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDRwrekZBZ31ACszDk2EJM_IqxRRwaGfCg",
            authDomain: "bd-marketing-55a81.firebaseapp.com",
            databaseURL: "https://bd-marketing-55a81-default-rtdb.firebaseio.com",
            projectId: "bd-marketing-55a81",
            storageBucket: "bd-marketing-55a81.firebasestorage.app",
            messagingSenderId: "678696512628",
            appId: "1:678696512628:web:edfc22a62f55dad41df521"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.togglePass = () => {
            const p = document.getElementById('password');
            const i = document.getElementById('eyeIcon');
            p.type = p.type === "password" ? "text" : "password";
            i.classList.toggle('fa-eye-slash');
        };

        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const userId = email.replace(/\./g, '_');

            if(pass.length < 4 || pass.length > 6) { alert("পাসওয়ার্ড অবশ্যই ৪-৬ সংখ্যার হতে হবে!"); return; }

            set(ref(db, 'users/' + userId), {
                name: document.getElementById('userName').value,
                age: document.getElementById('userAge').value,
                role: document.getElementById('userRole').value,
                email: email,
                password: pass
            }).then(() => {
                alert("রেজিস্ট্রেশন সফল!");
                window.location.href = "login.html";
            }).catch(err => alert("Error: " + err.message));
        });
    </script>
</body>
</html>
