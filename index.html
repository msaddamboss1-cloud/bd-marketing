<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BD-MARKETING</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #030508; color: #e2e8f0; }
        .owner-tag { background: linear-gradient(90deg, #3b82f6, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-card { background: rgba(10, 12, 16, 0.95); border: 1px solid rgba(255, 255, 255, 0.05); border-top: 2px solid #3b82f6; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
        .glass-input { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); transition: 0.3s; }
        .glass-input:focus { border-color: #3b82f6; background: rgba(59, 130, 246, 0.05); outline: none; }
    </style>
    <script>
        // অটো-লগইন চেক
        const session = JSON.parse(localStorage.getItem('userSession'));
        if (session && session.isLoggedIn) {
            window.location.href = session.role === "seller" ? "seller-home.html" : "buyer-home.html";
        }
    </script>
</head>
<body class="flex items-center justify-center min-h-screen p-4 py-10">
    <div class="w-full max-w-md glass-card p-7 rounded-[40px] relative text-center">
        <div class="mb-6">
            <h1 class="text-3xl font-black text-white italic tracking-tighter uppercase">BD-MARKETING</h1>
            <p class="text-[10px] font-black tracking-[3px] mt-1 uppercase owner-tag">Owner: Saddam</p>
        </div>
        <form id="loginForm" class="space-y-4 text-left">
            <select id="userRole" class="w-full glass-input p-3.5 rounded-xl text-sm font-bold text-white outline-none bg-[#0a0c10]">
                <option value="buyer">Buyer (কাজ করতে চাই)</option>
                <option value="seller">Seller (কাজ দিতে চাই)</option>
            </select>
            <input type="email" id="email" placeholder="ইমেইল (Email)" class="w-full glass-input p-3.5 rounded-xl text-sm font-bold text-white placeholder:text-slate-500" required>
            <div class="relative">
                <input type="password" id="password" placeholder="পাসওয়ার্ড" maxlength="6" class="w-full glass-input p-3.5 rounded-xl text-sm font-bold pr-12 text-white placeholder:text-slate-500" required>
                <button type="button" onclick="togglePass()" class="absolute right-4 top-3.5 text-slate-600"><i id="eyeIcon" class="fas fa-eye"></i></button>
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-700 p-3.5 rounded-xl text-sm font-black uppercase text-white shadow-xl transition-all active:scale-95">Login Now</button>
        </form>
        <div class="mt-6 flex gap-3">
            <a href="signup.html" class="flex-1 bg-white/5 border border-white/10 p-3 rounded-xl text-center text-[10px] font-black text-slate-300 uppercase hover:bg-white/10 transition-all">Create Account</a>
            <a href="legal-notice.html" class="flex-1 bg-amber-600/10 border border-amber-600/20 p-3 rounded-xl text-center text-[10px] font-black text-amber-500 uppercase hover:bg-amber-600/20 transition-all">Policy</a>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        const firebaseConfig = { apiKey: "AIzaSyDRwrekZBZ31ACszDk2EJM_IqxRRwaGfCg", authDomain: "bd-marketing-55a81.firebaseapp.com", databaseURL: "https://bd-marketing-55a81-default-rtdb.firebaseio.com", projectId: "bd-marketing-55a81", storageBucket: "bd-marketing-55a81.firebasestorage.app", messagingSenderId: "678696512628", appId: "1:678696512628:web:edfc22a62f55dad41df521" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.togglePass = () => { const p = document.getElementById('password'); const i = document.getElementById('eyeIcon'); p.type = p.type === "password" ? "text" : "password"; i.classList.toggle('fa-eye-slash'); };
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            loginBtn.innerText = "Checking...";
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const userId = email.replace(/\./g, '_');
            try {
                const snapshot = await get(ref(db, 'users/' + userId));
                if (snapshot.exists()) {
                    const userData = snapshot.val();
                    if (userData.password === pass) {
                        localStorage.setItem('userSession', JSON.stringify({ email: email, role: userData.role, name: userData.name, isLoggedIn: true }));
                        alert("লগইন সফল!");
                        window.location.href = userData.role === "seller" ? "seller-home.html" : "buyer-home.html";
                    } else { alert("ভুল পাসওয়ার্ড!"); }
                } else { alert("অ্যাকাউন্ট পাওয়া যায়নি!"); }
            } catch (err) { alert("Error: " + err.message); } finally { loginBtn.disabled = false; loginBtn.innerText = "Login Now"; }
        });
    </script>
</body>
</html>
