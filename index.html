<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD Marketing - Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #000; color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        .login-card { background: rgba(255,255,255,0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 40px; }
        .input-group { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); transition: 0.3s; }
        .input-group:focus-within { border-color: #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">
    <div class="absolute top-[-10%] left-[-10%] w-72 h-72 bg-blue-600/20 rounded-full blur-[120px]"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-72 h-72 bg-blue-900/20 rounded-full blur-[120px]"></div>

    <div class="login-card w-full max-w-md p-10 text-center relative z-10">
        <div class="mb-10">
            <h1 class="text-4xl font-black tracking-tighter text-blue-500 mb-2">BD <span class="text-white">MARKETING</span></h1>
            <p class="text-gray-500 text-xs uppercase tracking-[0.2em]">Ultra Master System</p>
        </div>

        <div class="space-y-5">
            <div class="input-group flex items-center p-4 rounded-3xl">
                <i class="fas fa-envelope text-gray-500 mr-4"></i>
                <input type="email" id="email" placeholder="আপনার ইমেইল" class="bg-transparent w-full outline-none text-sm">
            </div>
            <div class="input-group flex items-center p-4 rounded-3xl">
                <i class="fas fa-lock text-gray-500 mr-4"></i>
                <input type="password" id="password" placeholder="পাসওয়ার্ড দিন" class="bg-transparent w-full outline-none text-sm">
            </div>
            
            <button onclick="handleAuth()" class="w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-3xl font-black text-sm uppercase tracking-widest shadow-xl shadow-blue-500/30 transition transform active:scale-95">
                প্রবেশ করুন / একাউন্ট খুলুন
            </button>
        </div>

        <p class="mt-8 text-[10px] text-gray-600">নিরাপদ লগইন সিস্টেম © ২০২৬ সাদ্দাম এডমিন</p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="master-engine.js?v=AL-2.0"></script>
</body>
</html>
