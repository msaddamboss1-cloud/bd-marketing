<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - BD Marketing</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
</head>
<body>
    <div class="app-container">
        <div style="text-align:center; margin-bottom:30px; margin-top:50px;">
            <h1 style="color:var(--primary); font-size:32px;">WELCOME</h1>
            <p style="color:var(--muted)">Login to your account</p>
        </div>
        <div class="glass-card">
            <input id="email" type="email" placeholder="Email Address">
            <input id="pass" type="password" placeholder="Password">
            <button onclick="login(email.value, pass.value, err)">LOGIN NOW</button>
            <div id="err" class="error-msg"></div>
            <p style="text-align:center; margin-top:20px; font-size:14px;">
                No account? <a href="register.html" style="color:var(--primary); text-decoration:none;">Register Here</a>
            </p>
        </div>
    </div>
    <script src="config.js"></script>
    <script src="auth-engine.js"></script>
</body>
</html>
