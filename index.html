<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD Marketing | Login</title>
    <style>
        body { margin: 0; background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .logo { width: 100px; height: 100px; border-radius: 50%; border: 3px solid #10b981; margin-bottom: 15px; object-fit: cover; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 16px; }
        .btn-green { background: #10b981; color: white; }
        .btn-blue { background: #3b82f6; color: white; }
        .link { color: #94a3b8; cursor: pointer; margin-top: 15px; display: block; text-decoration: underline; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <img src="1000148624.png" class="logo" alt="Logo">
    
    <div id="reg-form">
        <h2 style="color: #10b981;">অ্যাকাউন্ট খুলুন</h2>
        <input type="text" id="r-name" placeholder="আপনার নাম">
        <input type="email" id="r-email" placeholder="জিমেইল">
        <input type="password" id="r-pass" placeholder="পাসওয়ার্ড">
        <button class="btn btn-green" onclick="register()">রেজিস্ট্রেশন করুন</button>
        <span class="link" onclick="toggle('login')">অ্যাকাউন্ট আছে? লগইন করুন</span>
    </div>

    <div id="login-form" class="hidden">
        <h2 style="color: #3b82f6;">লগইন করুন</h2>
        <input type="email" id="l-email" placeholder="আপনার জিমেইল">
        <input type="password" id="l-pass" placeholder="আপনার পাসওয়ার্ড">
        <button class="btn btn-blue" onclick="login()">প্রবেশ করুন</button>
        <span class="link" onclick="toggle('reg')">নতুন অ্যাকাউন্ট খুলুন</span>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script src="master-engine.js"></script>

<script>
    function toggle(mode) {
        document.getElementById('reg-form').style.display = mode === 'reg' ? 'block' : 'none';
        document.getElementById('login-form').style.display = mode === 'login' ? 'block' : 'none';
    }

    async function register() {
        const email = document.getElementById('r-email').value;
        const pass = document.getElementById('r-pass').value;
        try {
            const userCred = await auth.createUserWithEmailAndPassword(email, pass);
            await userCred.user.sendEmailVerification();
            alert("আপনার জিমেইলে ভেরিফিকেশন লিঙ্ক পাঠানো হয়েছে। চেক করুন!");
            toggle('login');
        } catch (e) { alert("ভুল হয়েছে: " + e.message); }
    }

    async function login() {
        const email = document.getElementById('l-email').value;
        const pass = document.getElementById('l-pass').value;
        try {
            const userCred = await auth.signInWithEmailAndPassword(email, pass);
            if(userCred.user.emailVerified) {
                window.location.href = "dashboard.html";
            } else {
                alert("দয়া করে আগে জিমেইল ভেরিফাই করুন!");
                auth.signOut();
            }
        } catch (e) { alert("লগইন ব্যর্থ! পাসওয়ার্ড বা জিমেইল ভুল।"); }
    }
</script>
</body>
</html>
