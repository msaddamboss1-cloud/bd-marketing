<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BD Marketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #080c14; font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .input-box { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); }
        input::placeholder { color: #64748b; font-weight: 500; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <script src="header.js"></script>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="glass-card w-full max-w-md p-10 rounded-[3rem] shadow-2xl">
            
            <div class="text-center mb-12">
                <h2 class="text-5xl font-black text-white uppercase italic tracking-tighter">LOGIN</h2>
                <p class="text-blue-500 text-[10px] uppercase font-black tracking-[0.3em] mt-3">WELCOME TO BD MARKETING</p>
            </div>

            <form id="loginForm" class="space-y-5">
                <div class="relative">
                    <i class="fas fa-envelope absolute left-5 top-1/2 -translate-y-1/2 text-blue-500"></i>
                    <input type="text" id="userIdentifier" required 
                        class="input-box w-full text-white pl-12 pr-4 py-5 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all text-sm" 
                        placeholder="Email or Mobile Number">
                </div>

                <div class="relative">
                    <i class="fas fa-key absolute left-5 top-1/2 -translate-y-1/2 text-blue-500"></i>
                    <input type="password" id="loginPass" required 
                        class="input-box w-full text-white pl-12 pr-14 py-5 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all text-sm" 
                        placeholder="Password">
                    
                    <button type="button" onclick="togglePassword()" class="absolute right-5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-blue-500 transition-colors text-lg">
                        <i id="eyeIcon" class="fas fa-eye"></i>
                    </button>
                </div>

                <div class="pt-4">
                    <button type="submit" id="loginBtn"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-5 rounded-[1.5rem] shadow-lg shadow-blue-900/30 transition-all active:scale-95 text-[12px] uppercase tracking-[0.2em] flex items-center justify-center">
                        <span id="btnText">SIGN IN ACCOUNT</span>
                    </button>
                </div>
            </form>

            <div class="mt-12 text-center">
                <p class="text-gray-500 text-[10px] font-black uppercase mb-3 tracking-widest">NEW USER? START EARNING NOW</p>
                <a href="register.html" class="text-blue-500 font-black uppercase text-sm hover:underline tracking-widest flex items-center justify-center gap-2">
                    CREATE NEW ACCOUNT <i class="fas fa-arrow-right text-xs"></i>
                </a>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDRwrekZBZ31ACszDk2EJM_IqxRRwaGfCg",
            authDomain: "bd-marketing-55a81.firebaseapp.com",
            databaseURL: "https://bd-marketing-55a81-default-rtdb.firebaseio.com",
            projectId: "bd-marketing-55a81",
            storageBucket: "bd-marketing-55a81.firebasestorage.app",
            messagingSenderId: "678696512628",
            appId: "1:678696512628:web:edfc22a62f55dad41df521",
            measurementId: "G-3CP5DC4H44"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const identifier = document.getElementById('userIdentifier').value;
            const pass = document.getElementById('loginPass').value;

            btnText.innerText = "Processing...";
            loginBtn.disabled = true;

            if (identifier.includes('@')) {
                signInWithEmailAndPassword(auth, identifier, pass)
                .then((userCredential) => {
                    checkUserRole(userCredential.user.uid);
                })
                .catch((error) => {
                    alert("Error: " + error.message);
                    resetBtn();
                });
            } else {
                const dbRef = ref(db);
                get(child(dbRef, `usersByPhone/${identifier}`)).then((snapshot) => {
                    if (snapshot.exists()) {
                        const email = snapshot.val().email;
                        signInWithEmailAndPassword(auth, email, pass)
                        .then((userCredential) => {
                            checkUserRole(userCredential.user.uid);
                        })
                        .catch((error) => {
                            alert("Wrong Password!");
                            resetBtn();
                        });
                    } else {
                        alert("User not found with this mobile number!");
                        resetBtn();
                    }
                });
            }
        });

        function checkUserRole(uid) {
            const dbRef = ref(db);
            get(child(dbRef, `users/${uid}`)).then((snapshot) => {
                if (snapshot.exists()) {
                    const role = snapshot.val().role;
                    // ✅ আপনার রিকুয়েস্ট অনুযায়ী worker_dashboard.html অপরিবর্তিত রাখা হলো
                    if (role === 'worker') {
                        window.location.href = "worker_dashboard.html";
                    } else {
                        window.location.href = "buyer_dashboard.html";
                    }
                }
            });
        }

        function resetBtn() {
            btnText.innerText = "SIGN IN ACCOUNT";
            loginBtn.disabled = false;
        }
    </script>

    <script>
        function togglePassword() {
            const passInput = document.getElementById('loginPass');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passInput.type = 'password';
                eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }
    </script>
</body>
</html>
