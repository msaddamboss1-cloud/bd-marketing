<!DOCTYPE html>
<html lang="bn">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
</head>
<body>
    <div class="container">
        <h1 style="color:#28a745; text-align:center;">BD Marketing</h1>
        <input type="email" id="logEmail" placeholder="আপনার ইমেইল">
        <input type="password" id="logPass" placeholder="পাসওয়ার্ড">
        <button class="btn-primary" onclick="login()">লগইন করুন</button>
        <p style="text-align:center;">নতুন? <a href="register.html">রেজিস্ট্রেশন করুন</a></p>
    </div>
    <script src="config.js"></script>
    <script>
        function login(){
            const e = document.getElementById('logEmail').value, p = document.getElementById('logPass').value;
            auth.signInWithEmailAndPassword(e,p).then(()=>window.location.href="dashboard.html").catch(err=>alert("ভুল তথ্য!"));
        }
    </script>
</body>
</html>
