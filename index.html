<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BD Marketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        body {
            background: radial-gradient(circle at top right, #0f172a, #020617);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
            color: white;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }
        .role-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .role-card.active {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);
        }
        .input-glow:focus {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
            border-color: #3b82f6;
        }
        .register-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="w-full max-w-md p-6">
        <div class="glass-card rounded-[40px] p-8">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-black tracking-tighter italic uppercase">Join BD Marketing</h1>
                <p class="text-blue-500 font-bold text-[10px] tracking-widest mt-1 uppercase">Create Your Account</p>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-6">
                <div id="role-worker" onclick="selectRole('Worker')" class="role-card active p-4 rounded-2xl text-center">
                    <i class="fas fa-tools mb-2 text-blue-500"></i>
                    <p class="text-[10px] font-black uppercase">Worker</p>
                </div>
                <div id="role-buyer" onclick="selectRole('Buyer')" class="role-card p-4 rounded-2xl text-center">
                    <i class="fas fa-shopping-cart mb-2 text-slate-500"></i>
                    <p class="text-[10px] font-black uppercase tracking-widest">Buyer</p>
                </div>
            </div>

            <div class="space-y-4">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500">
                        <i class="fas fa-user text-xs"></i>
                    </span>
                    <input type="text" id="username" placeholder="Full Name" 
                        class="w-full bg-black/40 border border-slate-800 py-3.5 pl-11 pr-4 rounded-2xl outline-none input-glow transition-all text-sm">
                </div>

                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500">
                        <i class="fas fa-envelope text-xs"></i>
                    </span>
                    <input type="email" id="email" placeholder="Gmail Address" 
                        class="w-full bg-black/40 border border-slate-800 py-3.5 pl-11 pr-4 rounded-2xl outline-none input-glow transition-all text-sm">
                </div>

                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500">
                        <i class="fas fa-lock text-xs"></i>
                    </span>
                    <input type="password" id="password" placeholder="Create Password" 
                        class="w-full bg-black/40 border border-slate-800 py-3.5 pl-11 pr-4 rounded-2xl outline-none input-glow transition-all text-sm">
                </div>

                <p id="error-msg" class="text-red-500 text-[10px] font-bold text-center hidden"></p>

                <button id="reg-btn" onclick="handleRegister()" 
                    class="register-btn w-full py-4 rounded-2xl font-black text-sm uppercase tracking-widest mt-2 shadow-lg shadow-blue-900/20">
                    Confirm & Register
                </button>

                <button onclick="window.location.href='login.html'" class="w-full text-slate-500 text-[10px] font-bold uppercase mt-2 hover:text-white transition-all">
                    Already have an account? Login
                </button>
            </div>
        </div>
    </div>

    <script>
        // এডমিন, আপনার কনফিগ এখানেও সেইম থাকবে
        const firebaseConfig = {
            apiKey: "AIzaSyDRwrekZBZ31ACszDk2EJM_IqxRRwaGfCg",
            authDomain: "bd-marketing-55a81.firebaseapp.com",
            databaseURL: "https://bd-marketing-55a81-default-rtdb.firebaseio.com",
            projectId: "bd-marketing-55a81",
            storageBucket: "bd-marketing-55a81.firebasestorage.app",
            messagingSenderId: "678696512628",
            appId: "1:678696512628:web:edfc22a62f55dad41df521",
            measurementId: "G-3CP5DC4H44"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let selectedRole = 'Worker';

        function selectRole(role) {
            selectedRole = role;
            document.getElementById('role-worker').classList.toggle('active', role === 'Worker');
            document.getElementById('role-buyer').classList.toggle('active', role === 'Buyer');
            
            // আইকন কালার চেঞ্জ লজিক
            document.querySelector('#role-worker i').className = role === 'Worker' ? 'fas fa-tools mb-2 text-blue-500' : 'fas fa-tools mb-2 text-slate-500';
            document.querySelector('#role-buyer i').className = role === 'Buyer' ? 'fas fa-shopping-cart mb-2 text-blue-500' : 'fas fa-shopping-cart mb-2 text-slate-500';
        }

        function handleRegister() {
            const name = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('reg-btn');

            if(!name || !email || !pass) {
                showError("সবগুলো ঘর পূরণ করুন!");
                return;
            }

            btn.innerText = "Creating Account...";
            btn.disabled = true;

            auth.createUserWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    const user = userCredential.user;
                    // ডাটাবেসে ইউজার ডাটা সেভ করা (ব্যালেন্স সহ)
                    db.ref('users/' + user.uid).set({
                        username: name,
                        email: email,
                        role: selectedRole,
                        balance: 0.00,
                        createdAt: new Date().toISOString()
                    }).then(() => {
                        window.location.href = "index.html";
                    });
                })
                .catch((error) => {
                    btn.innerText = "Confirm & Register";
                    btn.disabled = false;
                    showError(error.message);
                });
        }

        function showError(text) {
            const err = document.getElementById('error-msg');
            err.innerText = text;
            err.classList.remove('hidden');
        }
    </script>
</body>
</html>
