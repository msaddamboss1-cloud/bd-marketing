<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD Marketing - Access Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background: #020202; color: white; font-family: 'Inter', sans-serif; overflow: hidden; }
        .glass-ui { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 35px; }
        .input-style { background: #0a0a0a; border: 1px solid #1a1a1a; transition: 0.4s; }
        .input-style:focus { border-color: #3b82f6; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="glass-ui p-10 w-full max-w-sm shadow-2xl">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-black tracking-widest text-blue-500">BD MARKETING</h1>
            <p class="text-gray-500 text-[10px] mt-2 uppercase tracking-widest">Digital Future Starts Here</p>
        </div>

        <div id="authBox">
            <input type="email" id="email" placeholder="ইমেইল অ্যাড্রেস" class="input-style w-full p-4 rounded-2xl mb-4 outline-none">
            <input type="password" id="pass" placeholder="পাসওয়ার্ড" class="input-style w-full p-4 rounded-2xl mb-6 outline-none">
            <button onclick="handleAuth()" id="mainBtn" class="w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-2xl font-bold transition-all transform active:scale-95">প্রবেশ করুন</button>
            
            <p class="text-center text-xs text-gray-400 mt-8">একাউন্ট নেই? <span onclick="toggleAuth()" class="text-blue-500 cursor-pointer font-bold border-b border-blue-500">রেজিস্ট্রেশন করুন</span></p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="master-engine.js"></script>
</body>
</html>
