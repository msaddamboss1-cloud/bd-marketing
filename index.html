<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
</head>
<body>
    <div class="container">
        <h2 style="text-align:center; color:#27ae60;">BD Marketing</h2>
        <p style="text-align:center; color:#7f8c8d;">লগইন করে কাজ শুরু করুন</p>
        <input type="email" id="lEmail" placeholder="ইমেইল">
        <input type="password" id="lPass" placeholder="পাসওয়ার্ড">
        <button class="btn-primary" onclick="login()">লগইন</button>
        <p style="text-align:center;">অ্যাকাউন্ট নেই? <a href="register.html" style="color:#27ae60;">রেজিস্ট্রেশন</a></p>
    </div>
    <script src="config.js"></script>
    <script>
        function login(){
            const e=document.getElementById('lEmail').value, p=document.getElementById('lPass').value;
            if(!e || !p) { alert("সব তথ্য দিন"); return; }
            auth.signInWithEmailAndPassword(e,p).then(()=>window.location.href="dashboard.html").catch(()=>alert("ভুল ইমেইল বা পাসওয়ার্ড!"));
        }
    </script>
</body>
</html>
