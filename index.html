<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD Marketing - Home</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #f4f7f6; display: flex; align-items: center; height: 100vh; justify-content: center; font-family: sans-serif; }
        .auth-container { background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="auth-container" id="authBox">
    <div id="registerSection">
        <h3 class="text-center mb-4">রেজিস্ট্রেশন করুন</h3>
        <form id="regForm">
            <input type="email" id="regEmail" class="form-control mb-3" placeholder="ইমেইল" required>
            <input type="password" id="regPass" class="form-control mb-3" placeholder="পাসওয়ার্ড" required>
            <button type="submit" class="btn btn-primary w-100">একাউন্ট তৈরি করুন</button>
        </form>
        <p class="text-center mt-3">একাউন্ট আছে? <a href="#" onclick="toggleForm('login')">লগইন করুন</a></p>
    </div>

    <div id="loginSection" class="hidden">
        <h3 class="text-center mb-4">লগইন করুন</h3>
        <form id="loginForm">
            <input type="email" id="logEmail" class="form-control mb-3" placeholder="ইমেইল" required>
            <input type="password" id="logPass" class="form-control mb-3" placeholder="পাসওয়ার্ড" required>
            <button type="submit" class="btn btn-success w-100">প্রবেশ করুন</button>
        </form>
        <p class="text-center mt-3">নতুন ইউজার? <a href="#" onclick="toggleForm('register')">রেজিস্ট্রেশন করুন</a></p>
    </div>
</div>

<script>
    // আপনার Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyDRwrekZBZ31ACszDk2EJM_IqxRRwaGfCg",
        authDomain: "bd-marketing-your-id.firebaseapp.com", // আপনার প্রজেক্ট আইডি এখানে বসান
        projectId: "bd-marketing-your-id"
    };
    firebase.initializeApp(firebaseConfig);

    // ১. চেক করা ইউজার কি আগে থেকেই লগইন আছে? (Persistence)
    firebase.auth().onAuthStateChanged((user) => {
        if (user) {
            // যদি ইউজার লগইন থাকে, তাকে আর ফর্ম দেখাবে না, সরাসরি পাঠিয়ে দিবে
            window.location.href = "dashboard.html";
        }
    });

    // ২. রেজিস্ট্রেশন ফাংশন
    document.getElementById('regForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('regEmail').value;
        const pass = document.getElementById('regPass').value;
        firebase.auth().createUserWithEmailAndPassword(email, pass)
            .then(() => { 
                alert("রেজিস্ট্রেশন সফল!"); 
                window.location.href = "dashboard.html"; 
            })
            .catch((error) => alert(error.message));
    });

    // ৩. লগইন ফাংশন
    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('logEmail').value;
        const pass = document.getElementById('logPass').value;
        firebase.auth().signInWithEmailAndPassword(email, pass)
            .then(() => { window.location.href = "dashboard.html"; })
            .catch((error) => alert("ভুল ইমেইল বা পাসওয়ার্ড!"));
    });

    // ফর্ম পাল্টানোর ফাংশন
    function toggleForm(type) {
        if (type === 'login') {
            document.getElementById('registerSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
        } else {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('registerSection').classList.remove('hidden');
        }
    }
</script>
</body>
</html>
