<!DOCTYPE html>
<html lang="bn"><head><link rel="stylesheet" href="style.css"><title>Login | BD Marketing</title></head>
<body>
    <div class="container"><div class="card" style="text-align:center;">
        <img src="1000148624.png" style="width:80px; border-radius:50%; border:2px solid var(--primary); margin-bottom:15px;">
        <h2>লগইন প্যানেল</h2>
        <input type="email" id="l-email" placeholder="আপনার ইমেইল">
        <input type="password" id="l-pass" placeholder="পাসওয়ার্ড">
        <button class="btn buyer-btn" onclick="login()">প্রবেশ করুন</button>
        <p style="margin-top:15px; font-size:14px;">অ্যাকাউন্ট নেই? <a href="register.html" style="color:var(--primary);">রেজিস্ট্রেশন করুন</a></p>
    </div></div>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>
    <script>
        async function login() {
            const e = document.getElementById('l-email').value;
            const p = document.getElementById('l-pass').value;
            try {
                const res = await auth.signInWithEmailAndPassword(e, p);
                const doc = await db.collection("users").doc(res.user.uid).get();
                const role = doc.data().role;
                if(role === 'admin') window.location.href = 'admin-panel.html';
                else if(role === 'seller') window.location.href = 'seller-dashboard.html';
                else window.location.href = 'buyer-dashboard.html';
            } catch(err) { alert("ইমেইল বা পাসওয়ার্ড ভুল!"); }
        }
    </script>
</body></html>
