<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BD Marketing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-4">

    <div class="bg-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-sm border border-slate-700">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-blue-500">BD Marketing</h1>
            <p class="text-[10px] text-slate-500 font-mono">Admin: Saddam</p>
        </div>
        
        <form id="loginForm" class="space-y-4">
            <input type="email" id="loginEmail" required class="w-full bg-slate-700 border border-slate-600 rounded-xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500" placeholder="জিমেইল">
            <div class="relative">
                <input type="password" id="loginPass" required class="w-full bg-slate-700 border border-slate-600 rounded-xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500" placeholder="পাসওয়ার্ড">
                <span class="absolute inset-y-0 right-0 flex items-center pr-4 cursor-pointer text-slate-400" onclick="togglePass('loginPass', this)">
                    <i class="fas fa-eye"></i>
                </span>
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-xl transition-all active:scale-95">
                লগইন করুন
            </button>
        </form>
        <p class="text-center text-sm text-slate-500 mt-8">একাউন্ট নেই? <a href="signup.html" class="text-blue-500 font-extrabold hover:underline">নতুন খুলুন</a></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDRwrekZBZ31ACszDk2EJM_IqxRRwaGfCg",
            authDomain: "bd-marketing-55a81.firebaseapp.com",
            projectId: "bd-marketing-55a81",
            appId: "1:678696512628:web:edfc22a62f55dad41df521"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.togglePass = (id, el) => {
            const input = document.getElementById(id);
            const icon = el.querySelector('i');
            input.type = input.type === "password" ? "text" : "password";
            icon.classList.toggle('fa-eye'); icon.classList.toggle('fa-eye-slash');
        };

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> যাচাই হচ্ছে...`;
            
            try {
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPass').value;
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // রোল চেক করে রিডাইরেক্ট
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists()) {
                    const role = userDoc.data().role;
                    window.location.href = role === "seller" ? "seller_home.html" : "buyer_home.html";
                }
            } catch (error) {
                alert("লগইন ব্যর্থ! সঠিক তথ্য দিন।");
                btn.innerText = "লগইন করুন";
            }
        });
    </script>
</body>
</html>
